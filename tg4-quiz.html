<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,interactive-widget=resizes-content">
<title>TG4 Quiz | ADC Study Bank</title>
<meta name="description" content="Multiple-choice quiz on Therapeutic Guidelines: Oral and Dental v4 (2025). Every answer cites the TG4 page.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232A6049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' fill='white' text-anchor='middle' letter-spacing='-0.5'%3EOC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f2ed; --card:#ffffff; --border:#ddd8cf; --border-light:#ece8e2;
  --text:#1c1917; --muted:#78716c; --accent:#44403c;
  --badge-bg:#3d3935; --badge-text:#f5f2ed;
  --tg4-bg:#fdf8f0; --tg4-border:#c4a97a; --h3-bar:#b5a897;
  --green:#2A6049; --green-bg:#f2faf4; --green-border:#3a9a5c; --green-text:#14532d;
  --red-bg:#fff5f5; --red-border:#e85555; --red-text:#7a1a1a;
  --font-serif:'Playfair Display',Georgia,serif;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);
  min-height:100vh;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}

header.ec-header{display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:30;}
.ec-back{font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap;}
.ec-back:hover{color:var(--text);}
.ec-title{font-family:var(--font-serif);font-size:18px;font-weight:700;}
.ec-sub{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right;max-width:260px;}
@media(max-width:640px){.ec-sub{display:none;}}

main{max-width:680px;margin:0 auto;padding:24px 18px 90px;}

/* ---------- START SCREEN ---------- */
.q-intro{background:var(--tg4-bg);border:1px solid var(--tg4-border);border-radius:14px;
  padding:22px 22px 24px;text-align:center;}
.q-intro h1{font-family:var(--font-serif);font-size:26px;line-height:1.25;margin-bottom:10px;}
.q-intro p{font-size:14px;color:var(--accent);margin-bottom:6px;}
.q-intro .q-note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--green);color:#fff;border:none;border-radius:999px;
  padding:14px 30px;font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;margin-top:18px;min-height:48px;text-decoration:none;
  -webkit-tap-highlight-color:transparent;}
.btn:active{opacity:.85;}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--border);font-weight:600;}

/* ---------- PROGRESS ---------- */
.q-bar-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.q-bar{flex:1;height:6px;background:var(--border-light);border-radius:999px;overflow:hidden;}
.q-bar-fill{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s ease;}
.q-count{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.5px;
  white-space:nowrap;font-variant-numeric:tabular-nums;}
.q-score{font-size:11.5px;font-weight:700;color:var(--green);white-space:nowrap;
  font-variant-numeric:tabular-nums;}

/* ---------- QUESTION CARD ---------- */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:22px 20px;}
.q-cat{display:inline-block;background:var(--badge-bg);color:var(--badge-text);
  font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;margin-bottom:12px;}
.q-item{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  color:var(--muted);margin-left:8px;}
.q-text{font-family:var(--font-serif);font-size:21px;font-weight:700;line-height:1.35;
  margin-bottom:4px;}
.q-lead{font-size:12.5px;color:var(--muted);margin-bottom:18px;}

.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--border);border-radius:12px;
  padding:14px 16px;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);
  cursor:pointer;min-height:56px;font-variant-numeric:tabular-nums;
  transition:border-color .12s,background .12s;-webkit-tap-highlight-color:transparent;}
.opt:active{background:var(--border-light);}
.opt .opt-key{flex-shrink:0;width:26px;height:26px;border-radius:50%;
  background:var(--border-light);color:var(--accent);font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;}
.opt[disabled]{cursor:default;}
.opt.correct{border-color:var(--green-border);background:var(--green-bg);color:var(--green-text);}
.opt.correct .opt-key{background:var(--green-border);color:#fff;}
.opt.wrong{border-color:var(--red-border);background:var(--red-bg);color:var(--red-text);}
.opt.wrong .opt-key{background:var(--red-border);color:#fff;}
.opt.faded{opacity:.45;}

/* ---------- FEEDBACK ---------- */
.fb{margin-top:18px;border-radius:12px;padding:15px 17px;font-size:13.5px;line-height:1.65;
  border:1px solid var(--border);background:var(--bg);}
.fb.ok{background:var(--green-bg);border-color:#2a604933;}
.fb.no{background:var(--red-bg);border-color:#e8555533;}
.fb-verdict{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  margin-bottom:7px;}
.fb.ok .fb-verdict{color:var(--green-text);}
.fb.no .fb-verdict{color:var(--red-text);}
.fb-answer{font-weight:700;}
.fb-tip{margin-top:8px;color:var(--accent);}
.fb-tip b{color:var(--text);}

/* ---------- RESULTS ---------- */
.res-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:26px 22px;text-align:center;}
.res-score{font-family:var(--font-serif);font-size:52px;font-weight:700;line-height:1;}
.res-score span{font-size:26px;color:var(--muted);}
.res-band{font-size:15px;font-weight:700;margin-top:10px;}
.res-msg{font-size:13.5px;color:var(--muted);margin-top:8px;}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px;}

.review{margin-top:24px;}
.review h2{font-family:var(--font-serif);font-size:16px;margin-bottom:12px;}
.rv{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;margin-bottom:10px;font-size:13.5px;line-height:1.55;}
.rv-mark{flex-shrink:0;font-size:15px;line-height:1.5;}
.rv-name{font-weight:700;}
.rv-detail{color:var(--muted);font-size:12.5px;margin-top:3px;}
.rv-detail b{color:var(--text);font-weight:700;}

.q-disc{font-size:11.5px;line-height:1.6;color:var(--muted);
  border-top:1px solid var(--border);padding-top:14px;margin-top:30px;}
.q-disc a{color:var(--accent);}

/* ---------- TG4 QUIZ ADDITIONS ---------- */
.decks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
.deck{font-family:inherit;font-size:13px;font-weight:600;color:var(--accent);background:var(--card);
  border:1.5px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;
  -webkit-tap-highlight-color:transparent;}
.deck[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;}
.deck small{font-weight:500;opacity:.75;margin-left:4px;}
.opt{font-size:14.5px;font-weight:500;line-height:1.45;align-items:flex-start;}
.opt .opt-key{margin-top:1px;}
.q-text{font-size:19px;}
.fb-src{margin-top:10px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--tg4-border);
  padding:2px 0 2px 11px;font-style:italic;}
.src-link{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--green);
  background:none;border:none;cursor:pointer;padding:6px 0;font-family:inherit;text-decoration:underline;}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:flex;flex-direction:column;
  align-items:center;padding:14px;overflow:auto;}
.lb-top{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:900px;
  color:#fff;font-size:13px;font-weight:600;margin-bottom:10px;}
.lb-top button{background:#fff;border:none;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:inherit;}
.lb img{width:100%;max-width:900px;height:auto;background:#fff;border-radius:6px;}
.q-stats{font-size:12px;color:var(--muted);margin-top:12px;}
</style>
</head>
<body>

  <div class="ec-title">TG4 Quiz</div>
  <div class="ec-sub">175 questions, each cited to a TG4 page</div>
</header>

<script>
var POOL = [{"id": 1, "t": "abx", "q": "What is the key component of managing an acute odontogenic infection according to TG4?", "right": "A prompt dental procedure to address the source (e.g. extraction, root canal, debridement, surgery)", "wrong": ["A course of broad-spectrum antibiotics started as early as possible", "Analgesia and warm saline rinses while the swelling declares itself", "Referral to a general medical practitioner for antibiotics"], "why": "Antibiotics are not routinely indicated. The procedure removes the source; antibiotics are only ever an adjunct.", "p": 125, "quote": "An acute odontogenic infection requires prompt management with a dental procedure"}, {"id": 2, "t": "abx", "q": "Which of these is one of TG4's stated indications for antibiotics in an acute odontogenic infection?", "right": "A dental procedure to drain the infection is not likely to take place within 24 hours", "wrong": ["The patient is anxious about the infection getting worse", "A localised periapical abscess in a well patient booked for extraction tomorrow morning", "Any dental pain with a tender tooth on percussion"], "why": "TG4 lists three: adjunct in spreading infection; procedure not likely within 24 hours; and a retained fragment of an infected tooth with delayed extraction.", "p": 127, "quote": "if a dental procedure to drain the infection is not likely to take place within 24 hours"}, {"id": 3, "t": "abx", "q": "An infected (necrotic) molar fractures during extraction and the root tip cannot be retrieved today. Are antibiotics indicated?", "right": "Yes — a fragment of an infected tooth is retained and complete extraction is delayed", "wrong": ["No — antibiotics are never indicated after an extraction", "No — but only if the patient is a smoker", "Yes — but only if the patient has a fever above 38°C"], "why": "This is one of TG4's three indications. The aim is to reduce the risk of progression from localised to spreading infection; you still need to remove the fragment as soon as possible.", "p": 127, "quote": "if a fragment or root of an infected tooth is retained during extraction and complete extraction is delayed"}, {"id": 4, "t": "abx", "q": "A vital, non-infected tooth fractures during a routine extraction and a small root tip is left in place. Do you prescribe antibiotics?", "right": "No — antibiotics are not indicated if a noninfected fragment or root is retained", "wrong": ["Yes — any retained fragment needs 5 days of amoxicillin", "Yes — but only metronidazole, for anaerobic cover", "Yes — a single pre-operative dose of amoxicillin covers it"], "why": "Infected + retained is the trigger. A non-infected retained fragment does not need antibiotics.", "p": 128, "quote": "Antibiotics are not indicated if a noninfected tooth fragment or root is retained during an extraction."}, {"id": 5, "t": "abx", "q": "A patient presents with a localised periapical abscess (pain, no facial swelling, no systemic features). You can extract the tooth today. What does TG4 advise about antibiotics?", "right": "Not required routinely, because prompt drainage removes the source of infection", "wrong": ["Amoxicillin 500 mg 8-hourly for 5 days to prevent spread", "Metronidazole alone for 5 days", "A single stat dose of clindamycin before the procedure"], "why": "Prompt drainage removes the source and bacteraemia resolves rapidly. Do not routinely give antibiotics for a localised odontogenic infection.", "p": 131, "quote": "Antibiotic therapy is not required routinely for a localised infection if a dental procedure can be undertaken within 24 hours of presentation"}, {"id": 6, "t": "abx", "q": "Which patient with a localised odontogenic infection may warrant antibiotics even if a procedure is planned promptly?", "right": "A patient with profound immune compromise, decided in consultation with their specialist or medical practitioner", "wrong": ["A patient who has already taken paracetamol and ibuprofen", "A patient who is a regular smoker", "A patient whose tooth is tender to percussion"], "why": "Profound immune compromise raises the risk of rapidly spreading infection, so the decision should be made with the patient's specialist or GP.", "p": 131, "quote": "Antibiotic therapy may be indicated for localised infection in patients with profound immune compromise"}, {"id": 7, "t": "abx", "q": "For a patient with a mild pericoronal infection waiting to see a dentist, what interim self-care does TG4 recommend?", "right": "Irrigate under the operculum with sterile saline and rinse with warm saline or chlorhexidine mouthwash", "wrong": ["Apply a topical corticosteroid paste under the flap", "Bite firmly on a gauze pad for 30 minutes twice daily", "Rinse with hydrogen peroxide 3% undiluted"], "why": "Irrigation and rinsing may be enough to settle mild pericoronal infections until review decides whether a procedure is needed.", "p": 131, "quote": "the patient should, in addition, be advised to irrigate the area (using an irrigation syringe with sterile saline solution)"}, {"id": 8, "t": "abx", "q": "You are drainaging a spreading odontogenic abscess and want a culture. What is the best way to collect the sample?", "right": "Aspirate the pus with a needle and syringe into a sterile jar, before any antibiotic is given", "wrong": ["Take a swab from the surface of the abscess", "Send a saliva sample from the affected side", "Take a swab after the first dose of antibiotic to check response"], "why": "Swabs do not adequately preserve anaerobes and are easily contaminated with oral flora. Aspirate, and ideally sample before antibiotics.", "p": 132, "quote": "swabs do not adequately preserve anaerobes and are easily contaminated with oral flora"}, {"id": 9, "t": "abx", "q": "In a spreading odontogenic infection you can perform the dental procedure within 24 hours. What antibiotic strategy does TG4 recommend?", "right": "Penicillin monotherapy, started once the procedure has been performed", "wrong": ["Penicillin plus metronidazole, started before the procedure", "No antibiotics at all", "Amoxicillin + clavulanate as first line"], "why": "If the procedure is prompt, a penicillin alone is enough. If it cannot be done within 24 hours, or is incomplete, add metronidazole.", "p": 132, "quote": "If a dental procedure is promptly performed, penicillin monotherapy is recommended"}, {"id": 10, "t": "abx", "q": "When is a penicillin plus metronidazole combination recommended for a spreading odontogenic infection?", "right": "When the dental procedure cannot be performed within 24 hours or is incomplete", "wrong": ["Whenever the patient has a temperature above 37°C", "Whenever the patient is diabetic", "Only in children"], "why": "Metronidazole broadens anaerobic cover when source control is delayed or incomplete.", "p": 132, "quote": "If a dental procedure cannot be performed within 24 hours or is incomplete, a combination of a penicillin and metronidazole is recommended"}, {"id": 11, "t": "abx", "q": "Why can it be hard to get adequate analgesia in a patient with a spreading odontogenic infection?", "right": "Local anaesthetic may not work adequately in infected tissue, so minimal sedation or referral may be needed", "wrong": ["Local anaesthetics are contraindicated in any infection", "Adrenaline in the anaesthetic spreads the infection", "Antibiotics neutralise local anaesthetics"], "why": "TG4 notes minimal sedation, or referral for moderate/deep sedation or GA, may be required.", "p": 132, "quote": "It may not be possible to achieve adequate analgesia with local anaesthetics in patients with a spreading odontogenic infection"}, {"id": 12, "t": "abx", "q": "Adult, no allergy, spreading odontogenic infection, dental procedure will be done promptly. Which oral regimen is TG4's?", "right": "Amoxicillin 500 mg 8-hourly for 5 days (or phenoxymethylpenicillin 500 mg 6-hourly for 5 days)", "wrong": ["Amoxicillin 500 mg 12-hourly for 7 days", "Amoxicillin + clavulanate 875/125 mg 12-hourly for 10 days", "Metronidazole 400 mg 8-hourly for 5 days alone"], "why": "Both TG4 first-line penicillins are for 5 days. Phenoxymethylpenicillin is slightly preferred because it has the narrower spectrum.", "p": 132, "quote": "amoxicillin 500 mg (child: 15 mg/kg up to 500 mg) orally, 8-hourly for 5 days"}, {"id": 13, "t": "abx", "q": "Prompt dental treatment, spreading infection, and the patient reports a NONSEVERE reaction to penicillin (mild rash). What does TG4 say to use?", "right": "Cephalexin 500 mg 6-hourly for 5 days", "wrong": ["Clindamycin 300 mg 8-hourly for 5 days", "Amoxicillin 500 mg 8-hourly for 3 days under observation", "Metronidazole 400 mg 12-hourly for 5 days alone"], "why": "Nonsevere reactions (urticaria, mild immediate rash, benign childhood rash, maculopapular rash) are managed with cephalexin. Clindamycin is reserved for severe reactions.", "p": 133, "quote": "cephalexin 500 mg (child: 12.5 mg/kg up to 500 mg) orally, 6-hourly for 5 days"}, {"id": 14, "t": "abx", "q": "Prompt dental treatment, spreading infection, and the patient had anaphylaxis to amoxicillin. What does TG4 say to use?", "right": "Clindamycin 300 mg 8-hourly for 5 days", "wrong": ["Cephalexin 500 mg 6-hourly for 5 days", "Amoxicillin + clavulanate 875/125 mg 8-hourly for 5 days", "Metronidazole 400 mg 12-hourly plus cephalexin 500 mg 6-hourly"], "why": "Severe reactions mean avoiding penicillins AND cephalosporins in the community; the safe alternative is a non-beta-lactam such as clindamycin.", "p": 133, "quote": "clindamycin 300 mg (child 10 mg/kg up to 300 mg) orally, 8-hourly for 5 days"}, {"id": 15, "t": "abx", "q": "Dental treatment is going to be delayed beyond 24 hours in a spreading infection (no allergy). Which regimen is correct?", "right": "Metronidazole 400 mg 12-hourly PLUS phenoxymethylpenicillin or amoxicillin, all for 5 days", "wrong": ["Amoxicillin alone for 10 days", "Metronidazole 400 mg 8-hourly for 3 days alone", "Cephalexin 500 mg 6-hourly plus clindamycin"], "why": "Delayed treatment adds anaerobic cover. Amoxicillin + clavulanate 875/125 mg 8-hourly for 5 days is the single-drug alternative.", "p": 134, "quote": "metronidazole 400 mg (child: 10 mg/kg up to 400 mg) orally, 12-hourly for 5 days"}, {"id": 16, "t": "abx", "q": "Delayed dental treatment, and the patient has a NONSEVERE penicillin hypersensitivity. Which regimen is TG4's?", "right": "Metronidazole 400 mg 12-hourly PLUS cephalexin 500 mg 6-hourly, for 5 days", "wrong": ["Clindamycin 300 mg 8-hourly for 5 days", "Metronidazole 400 mg 12-hourly alone for 5 days", "Amoxicillin + clavulanate 875/125 mg 8-hourly for 5 days"], "why": "For nonsevere reactions, keep the beta-lactam (cephalexin) and add metronidazole for anaerobes. Metronidazole on its own is not the TG4 regimen.", "p": 134, "quote": "For patients who have had a nonsevere (immediate or delayed) [Note 6] hypersensitivity reaction to a penicillin [Note 7]; use:"}, {"id": 17, "t": "abx", "q": "Delayed dental treatment, and the patient has a SEVERE penicillin hypersensitivity. Which regimen is TG4's?", "right": "Clindamycin 300 mg 8-hourly for 5 days as a single drug", "wrong": ["Metronidazole plus cephalexin for 5 days", "Metronidazole plus amoxicillin for 5 days", "Doxycycline 100 mg 12-hourly for 5 days"], "why": "Clindamycin is the single-drug non-beta-lactam choice for a severe (immediate or delayed) reaction.", "p": 134, "quote": "clindamycin 300 mg (child: 10 mg/kg up to 300 mg) orally, 8-hourly for 5 days [Note 10]."}, {"id": 18, "t": "abx", "q": "In which patient is clindamycin the appropriate choice in dental practice?", "right": "A patient with a severe hypersensitivity reaction to a penicillin (e.g. anaphylaxis)", "wrong": ["A patient who had a mild rash to amoxicillin years ago", "A patient whose mother is allergic to penicillin", "A patient who gets nausea with amoxicillin"], "why": "TG4: lincosamides should be reserved for susceptible infections in patients with severe hypersensitivity to a penicillin. A mild rash is nonsevere (cephalexin territory); nausea is intolerance, not allergy.", "p": 34, "quote": "In dental practice, lincosamides should be reserved for the treatment of susceptible infections in patients with severe hypersensitivity to a penicillin"}, {"id": 19, "t": "abx", "q": "A patient taking clindamycin develops diarrhoea on day 3. What is the correct advice?", "right": "Stop the clindamycin and alert the dentist and GP for management advice", "wrong": ["Continue and take loperamide", "Continue and take a probiotic", "Halve the dose and complete the course"], "why": "Clindamycin, even short-term, carries an increased risk of Clostridioides difficile diarrhoea.", "p": 133, "quote": "If diarrhoea occurs, advise patients to stop the clindamycin and alert their dentist and general medical practitioner for management advice."}, {"id": 20, "t": "abx", "q": "What oral dose of amoxicillin + clavulanate does TG4 recommend for odontogenic infections, and why that frequency?", "right": "875 + 125 mg 8-hourly, because Haemophilus influenzae is a potential pathogen", "wrong": ["875 + 125 mg 12-hourly, as is standard practice", "500 + 125 mg 12-hourly, to limit gastrointestinal effects", "875 + 125 mg once daily, to improve adherence"], "why": "The common 12-hourly dose may be inadequate for some pathogens including H. influenzae. Amoxicillin + clavulanate has a limited role — use it when narrower regimens are unsuitable.", "p": 34, "quote": "the recommended dosage of amoxicillin+clavulanate is 875+125 mg orally, 8-hourly, because Haemophilus influenzae is a potential pathogen"}, {"id": 21, "t": "abx", "q": "Which penicillin does TG4 prefer for susceptible oral infections, and why?", "right": "Phenoxymethylpenicillin, because of its narrower spectrum of activity", "wrong": ["Amoxicillin, because it is more active against anaerobes", "Amoxicillin + clavulanate, because it covers beta-lactamase producers", "Ampicillin, because it is better absorbed"], "why": "Narrow spectrum = stewardship. Ideally 6-hourly, but it is reasonable to space the 4 doses evenly during waking hours.", "p": 33, "quote": "phenoxymethylpenicillin is preferred to amoxicillin because of its narrower spectrum of activity"}, {"id": 22, "t": "abx", "q": "Which two antimicrobials commonly used in dentistry have oral bioavailability above 90%?", "right": "Doxycycline and metronidazole", "wrong": ["Amoxicillin and cephalexin", "Clindamycin and amoxicillin + clavulanate", "Cephalexin and doxycycline"], "why": "Amoxicillin, amoxicillin + clavulanate, cephalexin and clindamycin sit between 50% and 90%.", "p": 20, "quote": "The following examples are antimicrobials that have oral bioavailability over 90% at standard oral dosing"}, {"id": 23, "t": "abx", "q": "A patient is drinking alcohol regularly and you prescribe metronidazole. What does TG4 suggest?", "right": "Avoid alcohol during treatment and for at least 24 hours after finishing the course", "wrong": ["Alcohol is safe in moderation with metronidazole", "Avoid alcohol only on the days you take a dose", "Avoid alcohol for two weeks after the course"], "why": "Reported reactions include nausea, vomiting, flushing, headache and palpitations. Evidence on frequency is conflicting, but TG4 still suggests avoidance.", "p": 35, "quote": "avoidance of alcohol during treatment and for at least 24 hours after completing the course of metronidazole is suggested"}, {"id": 24, "t": "abx", "q": "What is the TG4 recommended oral dose of metronidazole for mixed aerobic/anaerobic dental infections?", "right": "400 mg 12-hourly", "wrong": ["400 mg 8-hourly", "200 mg 8-hourly", "800 mg once daily"], "why": "TG4's 12-hourly dosing is based on pharmacokinetic data and MICs of the pathogens involved.", "p": 35, "quote": "the recommended dosage of metronidazole is 400 mg orally or 500 mg intravenously, 12-hourly"}, {"id": 25, "t": "abx", "q": "Which statement about doxycycline in children is supported by TG4?", "right": "Short courses (up to 10 days) have not been associated with tooth discolouration or enamel hypoplasia", "wrong": ["Doxycycline is contraindicated under 12 because it stains teeth", "Doxycycline stains teeth permanently after a single dose", "Doxycycline should only be used with milk to avoid staining"], "why": "Limitations in children are practical: there is no oral liquid formulation marketed in Australia.", "p": 35, "quote": "Short courses (up to 10 days) of doxycycline have not been associated with tooth discolouration, enamel hypoplasia or bone deposition, even in children."}, {"id": 26, "t": "abx", "q": "What counselling does oral doxycycline need?", "right": "Take with food and a large glass of water, stay upright for at least 30 minutes, and avoid sun exposure", "wrong": ["Take on an empty stomach lying down, to speed absorption", "Take with dairy products to protect the stomach", "No special advice is needed"], "why": "Oesophagitis and photosensitivity are the two key adverse effects.", "p": 35, "quote": "Oral doxycycline should be taken with food and a large glass of water, and the patient should be instructed to remain upright after administration, for at least 30 minutes."}, {"id": 27, "t": "abx", "q": "Which topical antifungal is not absorbed and so does not cause systemic effects or drug interactions?", "right": "Nystatin", "wrong": ["Miconazole", "Clotrimazole", "Fluconazole"], "why": "Azoles (miconazole, clotrimazole) can be systemically absorbed and interact with other drugs. Nystatin suspension does contain ~50% sucrose, which can promote plaque and caries.", "p": 35, "quote": "They are poorly absorbed orally and not absorbed through the mucosa when applied topically, so do not cause systemic effects or drug interactions."}, {"id": 28, "t": "abx", "q": "Why does TG4 flag a caution with nystatin oral suspension?", "right": "It has a high sucrose content (~50%), which may promote plaque accumulation and caries", "wrong": ["It stains teeth brown", "It causes oral thrush itself", "It is contraindicated with fluoride"], "why": "Otherwise topical intraoral polyenes have few adverse effects.", "p": 35, "quote": "Nystatin suspension has a high sucrose content (approximately 50%), which may promote plaque accumulation and dental caries."}, {"id": 29, "t": "abx", "q": "Can topical aciclovir cream be used inside the mouth for intraoral herpes?", "right": "No — it may be irritant inside the mouth", "wrong": ["Yes — it is the first-line intraoral treatment", "Yes — but only 5 times a day", "Yes — but only in children"], "why": "Topical aciclovir is for lips (5 times a day, so adherence is hard). Oral famciclovir single dose is a Schedule 3 option for cold sores.", "p": 36, "quote": "Topical aciclovir should not be used inside the mouth because it may be irritant."}, {"id": 30, "t": "abx", "q": "A patient with a spreading odontogenic infection has had source control and antibiotics. When should you review?", "right": "Within 48 to 72 hours of achieving source control", "wrong": ["Within 24 hours", "After 7 days, at the end of the course", "Only if symptoms worsen"], "why": "Review at 48–72 hours, then decide whether to continue, escalate or stop.", "p": 135, "quote": "Review progress within 48 to 72 hours of achieving source control in spreading odontogenic infections."}, {"id": 31, "t": "abx", "q": "At the 48–72 hour review the patient is clearly improving and source control was achieved. What does TG4 say?", "right": "Advise them to stop the antibiotics — it is not necessary to complete the prescribed course", "wrong": ["Continue to the end of the course regardless, to prevent resistance", "Extend the course by 2 days for safety", "Switch to a broader spectrum antibiotic"], "why": "Also explain they should seek prompt dental review if they deteriorate, or if the infection has not resolved within 5 days from the start of treatment. This decision is made AT the review — the script itself still starts as the standard 5-day course.", "p": 135, "quote": "If source control is achieved and the patient is improving at 48 to 72 hours, advise them to stop the antibiotics as it is not necessary to complete the prescribed course."}, {"id": 32, "t": "abx", "q": "A spreading infection has not responded by 48–72 hours after antibiotics started on penicillin monotherapy. Which action fits TG4?", "right": "Check for severe features, confirm source control, and add metronidazole or switch to amoxicillin + clavulanate", "wrong": ["Double the penicillin dose and review in a week", "Stop antibiotics and reassure", "Switch to a topical antibacterial"], "why": "If any severe local or systemic feature is present, urgent hospital transfer is required. Otherwise re-review in another 48–72 hours.", "p": 135, "quote": "review the current antibiotic regimen; if empirical therapy was penicillin monotherapy, add oral metronidazole or switch to amoxicillin + clavulanate"}, {"id": 33, "t": "abx", "q": "A patient was started on antibiotics by their GP before seeing you. What is the key message?", "right": "Dental review is needed as soon as possible — antibiotics are not a substitute for a dental procedure", "wrong": ["Continue the GP's antibiotics and review in two weeks", "Change the antibiotic to a broader spectrum agent", "Delay the procedure until the antibiotic course is finished"], "why": "Never let antibiotics stand in for source control.", "p": 135, "quote": "antibiotics are not a substitute for a dental procedure"}, {"id": 34, "t": "abx", "q": "Which finding in a spreading odontogenic infection indicates risk of airway obstruction?", "right": "Swelling of the floor of the mouth, trismus, neck swelling or difficulty swallowing/breathing", "wrong": ["Halitosis and a bad taste", "A temperature of 37.6°C", "Pain on chewing"], "why": "These are the 'severe local features' — they trigger urgent hospital transfer.", "p": 136, "quote": "swelling of floor of mouth"}, {"id": 35, "t": "abx", "q": "Swelling of the upper third of the face occluding the eye in a spreading odontogenic infection indicates risk of what?", "right": "Cavernous sinus thrombosis", "wrong": ["Ludwig angina", "Osteomyelitis of the mandible", "Sialadenitis"], "why": "Ludwig angina is bilateral submandibular, sublingual and submental spread with airway risk.", "p": 136, "quote": "A spreading odontogenic infection with swelling of the upper third of the face, occluding the eye, indicates a risk of cavernous sinus thrombosis."}, {"id": 36, "t": "abx", "q": "Which temperature range is a systemic feature suggesting risk of sepsis in a spreading odontogenic infection?", "right": "Above 38°C or below 36°C", "wrong": ["Above 37°C only", "Above 39°C only", "Below 35°C only"], "why": "Other systemic features: pallor, sweating, tachycardia. Note that fever alone at 37.8°C does not meet the threshold.", "p": 136, "quote": "temperature above 38°C or below 36 C"}, {"id": 37, "t": "abx", "q": "A patient with a spreading dental infection has difficulty breathing and looks blue. What should you do?", "right": "Call an ambulance, give 100% oxygen by mask, let them adopt a position of comfort, and arrange urgent transfer", "wrong": ["Lay them flat and start oral amoxicillin", "Book an urgent appointment for the next morning", "Give oral antibiotics and observe for one hour"], "why": "TG4 specifically says to allow a position of comfort, and to transfer to a hospital with an oral and maxillofacial surgeon or other appropriate expert.", "p": 137, "quote": "allowing the patient to adopt a position of comfort"}, {"id": 38, "t": "abx", "q": "Which IV regimen does TG4 give for a hospital patient with severe local/systemic features but no sepsis (no allergy)?", "right": "Benzylpenicillin 1.8 g 6-hourly plus metronidazole 500 mg 12-hourly, with surgical intervention", "wrong": ["Ceftriaxone 1 g daily alone", "Vancomycin plus gentamicin", "Oral amoxicillin 500 mg 8-hourly"], "why": "Narrow-spectrum benzylpenicillin + metronidazole is preferred for stewardship. Amoxicillin + clavulanate IV is an alternative, not preferred.", "p": 138, "quote": "benzylpenicillin 1.8 g (child: 50 mg/kg up to 1.8 g) intravenously, 6-hourly"}, {"id": 39, "t": "abx", "q": "Which of these is a sign of a postoperative odontogenic infection after extraction?", "right": "Pain and swelling that is worsening, or not improving, 4 days after surgery", "wrong": ["Mild swelling that peaks on day 1", "Oozing for the first two hours", "A blood clot in the socket on day 2"], "why": "Others: cellulitis, fluctuant site, purulent discharge, foul taste, or severe local/systemic features.", "p": 141, "quote": "pain and swelling that is worsening or is not improving 4 days after surgery"}, {"id": 40, "t": "abx", "q": "Does surgical antibiotic prophylaxis reduce the incidence of infection after dentoalveolar surgery?", "right": "No — postoperative infections are uncommon and their incidence is not reduced by prophylaxis", "wrong": ["Yes — by about half", "Yes — but only after implant surgery", "Only in smokers"], "why": "This underpins TG4's restrained approach to prophylaxis.", "p": 141, "quote": "their incidence is not reduced by surgical antibiotic prophylaxis"}, {"id": 41, "t": "abx", "q": "Before diagnosing a postoperative odontogenic infection after an extraction, what should you exclude?", "right": "Postsurgical inflammation and alveolar osteitis (dry socket)", "wrong": ["Trigeminal neuralgia", "Sinusitis", "Periodontitis"], "why": "Dry socket is commonly misdiagnosed as infection — and antibiotics have no role in it.", "p": 141, "quote": "Before diagnosing a postoperative odontogenic infection, exclude postsurgical inflammation, and alveolar osteitis (dry socket) after a tooth extraction."}, {"id": 42, "t": "abx", "q": "Why are oral antibiotics 'usually required' for a postoperative odontogenic infection?", "right": "Because complete drainage is often not feasible", "wrong": ["Because the socket is always contaminated with Candida", "Because the patient is always immunocompromised", "Because surgical prophylaxis failed"], "why": "Choose the empirical regimen for spreading infection when dental treatment is delayed. Also: regular antiseptic mouthwash, washout/debridement of debris, drainage and culture, remove residual fragments seen on X-ray, analgesia and rehydration.", "p": 141, "quote": "oral antibiotics – usually required because complete drainage is often not feasible"}, {"id": 43, "t": "abx", "q": "A patient with a post-extraction infection reports a mild rash to penicillin years ago. Applying TG4, what is the empirical oral antibiotic regimen?", "right": "Metronidazole 400 mg 12-hourly PLUS cephalexin 500 mg 6-hourly for 5 days", "wrong": ["Clindamycin 300 mg 8-hourly for 5 days", "Metronidazole 400 mg 12-hourly alone for 5 days", "Amoxicillin 500 mg 8-hourly, with monitoring for rash"], "why": "TG4 sends postoperative infections to the 'delayed treatment' regimen (p.141). A mild rash is nonsevere, so it is metronidazole + cephalexin; clindamycin is for severe reactions.", "p": 141, "quote": "use an empirical antibiotic regimen for spreading odontogenic infections without severe local or systemic features if dental treatment is delayed"}, {"id": 44, "t": "allergy", "q": "A patient's mother is allergic to penicillin; the patient has never had a reaction. Should you avoid penicillin?", "right": "No — a family history of allergy does not justify avoiding the drug", "wrong": ["Yes — allergy is strongly heritable", "Yes — use a cephalosporin instead", "Only for amoxicillin, not phenoxymethylpenicillin"], "why": "Only the patient's own reaction history guides avoidance.", "p": 24, "quote": "A family history of antimicrobial allergy does not justify avoidance of the implicated drug."}, {"id": 45, "t": "allergy", "q": "Which reported reaction is most consistent with a predictable drug intolerance rather than hypersensitivity?", "right": "Nausea and diarrhoea", "wrong": ["Hives within an hour", "Lip swelling", "Wheeze and collapse"], "why": "Intolerance examples: nausea, vomiting, diarrhoea, headache, dizziness, itch without rash. If the history suggests intolerance, direct delabelling by a medical practitioner is appropriate.", "p": 24, "quote": "predictable drug intolerance (eg nausea; vomiting; diarrhoea; headache; dizziness; itch without rash, fever or internal organ involvement)"}, {"id": 46, "t": "allergy", "q": "If a patient's 'penicillin allergy' is really a drug intolerance (e.g. GI upset), what is the appropriate step?", "right": "Direct delabelling by a medical practitioner, based on the history alone", "wrong": ["Skin prick testing in the dental chair", "Desensitisation under dental supervision", "Keep the allergy label to be safe"], "why": "Removing an inappropriate label restores antibiotic choice. Allergy testing must be done by someone with expertise and resuscitation facilities.", "p": 25, "quote": "direct delabeling of the patient's allergy (ie removal of a patient's reported antibiotic allergy based on their history alone) by a medical practitioner is appropriate"}, {"id": 47, "t": "allergy", "q": "For which type of penicillin hypersensitivity is desensitisation contraindicated?", "right": "Severe delayed hypersensitivity", "wrong": ["Severe immediate (IgE-mediated) hypersensitivity", "Nonsevere delayed hypersensitivity", "Drug intolerance"], "why": "Desensitisation may be considered by medical practitioners in severe immediate IgE-mediated reactions if no alternative exists.", "p": 25, "quote": "Desensitisation is contraindicated in patients with severe delayed hypersensitivity."}, {"id": 48, "t": "allergy", "q": "Immediate (IgE-mediated) penicillin hypersensitivity typically occurs within what time of exposure?", "right": "1 to 2 hours", "wrong": ["Within 5 minutes only", "24 to 48 hours", "5 to 7 days"], "why": "Delayed (T-cell mediated) reactions typically occur days after starting treatment, though sooner on rechallenge.", "p": 27, "quote": "typically occurs within 1 to 2 hours of drug exposure"}, {"id": 49, "t": "allergy", "q": "According to TG4, which patients can safely receive a cephalosporin such as cephalexin?", "right": "Patients with a nonsevere (immediate or delayed) penicillin hypersensitivity", "wrong": ["Only patients with no penicillin allergy", "Only patients who tolerate amoxicillin", "No patient reporting any penicillin allergy"], "why": "Even so, consider the extent of the reaction, patient acceptability and non-beta-lactam options. It is a 'consider', not a contraindication.", "p": 31, "quote": "Cephalosporins are safe to administer to patients with nonsevere (immediate or delayed) penicillin hypersensitivity."}, {"id": 50, "t": "allergy", "q": "A patient had a mild maculopapular rash to amoxicillin. Which statement is correct?", "right": "Avoid penicillins; cephalexin is considered safe, weighing the extent of the reaction", "wrong": ["Avoid penicillins AND all cephalosporins", "Amoxicillin can be given again without review", "Only IV cefazolin is safe"], "why": "Nonsevere reaction: penicillins are avoided, cephalosporins (e.g. cephalexin) are listed as safe to administer.", "p": 31, "quote": "it can still be administered in patients with nonsevere (immediate or delayed) hypersensitivity to penicillins"}, {"id": 51, "t": "allergy", "q": "Which of these is a severe delayed penicillin hypersensitivity reaction?", "right": "Stevens–Johnson syndrome / toxic epidermal necrolysis", "wrong": ["A benign childhood rash", "A maculopapular rash", "Mild urticaria"], "why": "Severe delayed reactions also include DRESS, severe blistering or desquamative rash, and organ involvement such as acute interstitial nephritis.", "p": 32, "quote": "Avoid all penicillins and cephalosporins in patients with severe delayed penicillin hypersensitivity"}, {"id": 52, "t": "allergy", "q": "In the community, a patient with a SEVERE immediate reaction to penicillin needs an antibiotic. What does TG4 advise?", "right": "Avoid all penicillins and cephalosporins and use a non-beta-lactam (e.g. clindamycin)", "wrong": ["Use cephalexin because cross-reactivity is only 1.5%", "Use amoxicillin in the chair with adrenaline drawn up", "Use cefazolin orally"], "why": "Cross-reactivity is generally unlikely, but a severe immediate reaction is harder to manage in the community than in hospital where resuscitation facilities are closer.", "p": 31, "quote": "For patients with severe immediate penicillin hypersensitivity in community dental practice, avoid all penicillins and cephalosporins."}, {"id": 53, "t": "allergy", "q": "What proportion of patients with a confirmed penicillin allergy also have a cephalosporin allergy, per recent evidence quoted in TG4?", "right": "Less than 1.5%", "wrong": ["About 10%", "About 30%", "About 50%"], "why": "The commonly quoted ~10% is a misconception. Most reactions are to R1 side-chains, so cross-reactions are uncommon unless drugs share the same or similar side-chains.", "p": 30, "quote": "Recent evidence suggests that less than 1.5% of patients with a confirmed penicillin allergy have a cephalosporin allergy"}, {"id": 54, "t": "allergy", "q": "What mainly determines cross-reactivity between penicillins and cephalosporins?", "right": "Shared or similar R1 side-chains, not the beta-lactam ring itself", "wrong": ["The beta-lactam ring common to all beta-lactams", "The salt form of the drug", "The dose given"], "why": "Only rarely are patients allergic to the beta-lactam ring itself (more relevant in severe delayed reactions).", "p": 30, "quote": "clinical data show that most reactions occur in response to antigenic molecules in the R1 side-chain"}, {"id": 55, "t": "allergy", "q": "Which cephalosporin shares a similar R1 side-chain with amoxicillin and ampicillin?", "right": "Cephalexin (and cefaclor)", "wrong": ["Cefazolin", "Ceftriaxone", "Cefuroxime"], "why": "Cefazolin has no similar side-chain to any listed penicillin, which is why it is considered safe even in severe immediate hypersensitivity in hospital.", "p": 31, "quote": "the aminocephalosporins (cephalexin and cefaclor) share the same or similar R1 side-chain with the aminopenicillins (amoxicillin and ampicillin)"}, {"id": 56, "t": "allergy", "q": "You cannot tell how severe a patient's reaction to penicillin really was. What does TG4 suggest before prescribing a non-beta-lactam?", "right": "Consult the patient's medical practitioner to investigate further, if possible", "wrong": ["Prescribe clindamycin anyway to be safe", "Do a penicillin challenge in the dental chair", "Prescribe azithromycin"], "why": "Non-beta-lactams carry their own risks: antibiotic-associated diarrhoea and antimicrobial resistance.", "p": 26, "quote": "dental practitioners should consult with the patient's medical practitioner to investigate further, if possible, before prescribing a non-beta lactam"}, {"id": 57, "t": "allergy", "q": "A patient reports a history of cephalosporin hypersensitivity. What does TG4 advise?", "right": "Seek expert advice", "wrong": ["Use cephalexin at half dose", "Use amoxicillin instead", "Avoid all antibiotics"], "why": "The dental guidance covers penicillin allergy; cephalosporin hypersensitivity needs expert input.", "p": 26, "quote": "For management of patients with a history of cephalosporin hypersensitivity, seek expert advice."}, {"id": 58, "t": "allergy", "q": "Which question belongs in an antimicrobial allergy history (Figure 13.6)?", "right": "Have you taken other antibiotics without problems since the reaction?", "wrong": ["What is your religion?", "Do you drink coffee?", "Have you ever had a dental abscess?"], "why": "Also: how the reaction was managed (treatment/hospitalisation), timing after the dose, and how many years ago.", "p": 25, "quote": "Are there other antibiotics that you have taken without problems since the reaction?"}, {"id": 59, "t": "allergy", "q": "Why does TG4 discourage widespread use of cephalosporins?", "right": "It is linked to rising MRSA, VRE, multidrug-resistant gram-negatives and C. difficile", "wrong": ["They are more expensive", "They cause tooth staining", "They are absorbed poorly in adults"], "why": "Stewardship: use the narrowest spectrum that fits.", "p": 33, "quote": "Widespread use of cephalosporins is linked to an increasing prevalence of infections caused by methicillin-resistant Staphylococcus aureus"}, {"id": 60, "t": "abx", "q": "According to TG4, which is a reasonable stewardship action in a general dental practice?", "right": "Specify the antibiotic duration on the prescription", "wrong": ["Prescribe antibiotics for all localised abscesses", "Prefer broad-spectrum agents to cover all cases", "Avoid documenting the indication"], "why": "Other strategies: avoid antibiotics when likelihood of benefit is low, choose narrow spectrum, take a thorough allergy history, and use shared decision-making.", "p": 23, "quote": "Specify the duration of antimicrobial therapy on the prescription"}, {"id": 61, "t": "pain", "q": "Which drug class does TG4 name as preferred for acute and postprocedural dental pain in most patients?", "right": "NSAIDs", "wrong": ["Opioids", "Paracetamol alone", "Benzodiazepines"], "why": "NSAIDs are anti-inflammatory, effective for bone pain, and reduce opioid requirements.", "p": 39, "quote": "NSAIDs are the preferred analgesics for acute and postprocedural dental pain in most patients"}, {"id": 62, "t": "pain", "q": "Why are benzodiazepines not appropriate for acute dental pain?", "right": "They are not analgesics and carry risks of excessive sedation and dependence", "wrong": ["They interact with local anaesthetics", "They only work by injection", "They raise blood pressure"], "why": "Anxiolysis is a separate question; they do not treat pain.", "p": 38, "quote": "Benzodiazepines are not appropriate for managing acute pain because they are not analgesics"}, {"id": 63, "t": "pain", "q": "A patient cannot take an NSAID. What is the preferred analgesic?", "right": "Paracetamol", "wrong": ["Codeine", "Tramadol", "Diazepam"], "why": "If paracetamol is not suitable or insufficient, consider a short course of an opioid; if neither works, seek medical advice.", "p": 39, "quote": "Paracetamol is preferred in people who cannot use an NSAID"}, {"id": 64, "t": "pain", "q": "Which patient should NOT be prescribed an NSAID by a dentist?", "right": "A patient with severe kidney impairment (eGFR below 30 mL/min)", "wrong": ["A patient with well-controlled asthma who has used ibuprofen before", "A patient with mild hypertension, for a 2-day course", "A breastfeeding patient"], "why": "Others: cirrhosis, severe heart failure, recent peptic ulcer/GI bleed, haemophilia/von Willebrand, low platelets. Asthma alone is not a contraindication.", "p": 39, "quote": "patients with severe kidney impairment (eGFR of less than 30 mL/min)"}, {"id": 65, "t": "pain", "q": "What is the maximum duration of NSAID use for acute pain without medical consultation?", "right": "5 days", "wrong": ["2 days", "10 days", "14 days"], "why": "Shorter is preferred if the patient has increased risk of NSAID toxicity.", "p": 40, "quote": "Use for more than 5 days is not recommended in any patient for managing acute pain without medical consultation."}, {"id": 66, "t": "pain", "q": "Is asthma a contraindication to NSAIDs?", "right": "Not unless the patient has had an exacerbation after taking NSAIDs", "wrong": ["Yes, always", "Yes, but only in children", "Only for COX-2-selective NSAIDs"], "why": "If NSAID-induced respiratory symptoms have occurred, use a COX-2-selective NSAID (e.g. celecoxib) and avoid nonselective NSAIDs.", "p": 43, "quote": "Asthma is not a contraindication to NSAIDs unless the patient has experienced an exacerbation after taking NSAIDs"}, {"id": 67, "t": "pain", "q": "For a patient with increased gastrointestinal risk where an NSAID is unavoidable (short course), which is preferred?", "right": "A COX-2-selective NSAID such as celecoxib, for less than 5 days", "wrong": ["Ibuprofen with food", "Diclofenac", "Naproxen"], "why": "Nonselective NSAIDs (ibuprofen, diclofenac, naproxen) are avoided in this group. The COX-2 advantage is reduced if the patient takes low-dose aspirin.", "p": 41, "quote": "use a COX-2-selective NSAID (eg celecoxib"}, {"id": 68, "t": "pain", "q": "A patient at increased cardiovascular risk needs a short NSAID course. Which should be avoided?", "right": "Diclofenac (and COX-2-selective NSAIDs other than celecoxib)", "wrong": ["Ibuprofen", "Celecoxib", "Naproxen, because it is completely free of GI risk"], "why": "Use celecoxib or ibuprofen for under 5 days; naproxen is possible but carries higher GI risk.", "p": 41, "quote": "avoid diclofenac and COX-2-selective NSAIDs other than celecoxib"}, {"id": 69, "t": "pain", "q": "A patient is on an ACE inhibitor plus a diuretic and you want to prescribe an NSAID. What is the concern?", "right": "Cumulative risk of acute kidney injury", "wrong": ["Hypoglycaemia", "Serotonin toxicity", "Bleeding from platelet inhibition only"], "why": "The risk of AKI is cumulative — ACEI/ARB + diuretic + NSAID is the classic 'triple whammy'. Consult a medical practitioner unless paracetamol alone will do.", "p": 40, "quote": "the risk is significantly increased if an NSAID is co-administered with an ACEI (or an ARB) plus a diuretic"}, {"id": 70, "t": "pain", "q": "When may NSAIDs be considered in pregnancy, per TG4?", "right": "Only nonselective NSAIDs before 30 weeks, if no alternative is suitable, at the lowest dose for the shortest time", "wrong": ["Any time, if taken with food", "Celecoxib in the third trimester", "Never under any circumstances"], "why": "Do not prescribe for more than 48 hours after 20 weeks unless on medical or obstetric advice; NSAIDs must not be continued after 30 weeks.", "p": 42, "quote": "NSAIDs must not be continued after 30 weeks gestation"}, {"id": 71, "t": "pain", "q": "Which NSAID is preferred for a breastfeeding patient?", "right": "Ibuprofen", "wrong": ["Naproxen", "Diclofenac", "Celecoxib"], "why": "Advise feeding the baby just before taking the medication to minimise drug in breast milk.", "p": 42, "quote": "Ibuprofen is the preferred NSAID for patients who are breastfeeding."}, {"id": 72, "t": "pain", "q": "What is TG4's current advice on taking NSAIDs with food?", "right": "It is no longer advised — there is no evidence it reduces adverse effects, and it delays absorption", "wrong": ["Always take with food to protect the stomach", "Take only on an empty stomach", "Take with milk"], "why": "Also: combine with paracetamol; take regularly for 1–2 days at the lowest effective dose, then switch to as-required, then stop.", "p": 43, "quote": "It is no longer advised that NSAIDs be taken with food to reduce adverse effects"}, {"id": 73, "t": "pain", "q": "What is the maximum daily dose of paracetamol?", "right": "4 g per day (8 immediate-release or 6 modified-release tablets)", "wrong": ["2 g per day", "6 g per day", "1 g per day"], "why": "Check all the patient's medicines, including over-the-counter, for hidden paracetamol.", "p": 44, "quote": "the maximum paracetamol dose is 4 g per day"}, {"id": 74, "t": "pain", "q": "How should the dose of paracetamol be written on a prescription?", "right": "In grams or milligrams, not number of tablets or volume of liquid (unless formulation is specified)", "wrong": ["As number of tablets", "As 'two tablets as needed'", "As a volume of liquid"], "why": "This reduces dosing errors across formulations.", "p": 44, "quote": "the dose should be stated in grams or milligrams rather than the number of tablets or volume of liquid"}, {"id": 75, "t": "pain", "q": "In an adult with liver disease, what does TG4 say about paracetamol dosing?", "right": "Usual doses are appropriate; routine dose reduction is not indicated (seek advice in liver failure or combined risk factors)", "wrong": ["Halve the dose automatically", "Avoid paracetamol entirely", "Use codeine instead"], "why": "Dose reduction may result in inadequate analgesia and use of more harmful analgesics.", "p": 44, "quote": "In adults with liver disease, or who are underweight, cachectic or frail, usual doses of paracetamol are appropriate"}, {"id": 76, "t": "pain", "q": "Which opioid is TG4's preferred immediate-release opioid in dentistry?", "right": "Oxycodone", "wrong": ["Codeine", "Tramadol", "Morphine"], "why": "It has widespread experience, fewer interactions than tramadol, and more predictable pharmacokinetics and greater efficacy than codeine.", "p": 48, "quote": "oxycodone prefered opioid because of"}, {"id": 77, "t": "pain", "q": "Why does TG4 no longer recommend codeine?", "right": "Its use is associated with more harm than benefit, and it is no more effective than paracetamol plus ibuprofen", "wrong": ["It is unavailable in Australia", "It causes tooth staining", "It has no analgesic effect at all"], "why": "Codeine is a prodrug with variable conversion to morphine — some patients get no effect, others morphine toxicity.", "p": 47, "quote": "codeine is no longer recommended for pain management"}, {"id": 78, "t": "pain", "q": "Why does TG4 not recommend tramadol in dentistry?", "right": "Serious adverse effects (including seizures) and interactions that can cause serotonin toxicity", "wrong": ["It is an NSAID", "It is not available on the PBS", "It only works on neuropathic pain"], "why": "It is a prodrug with active metabolites, so its effects can be unpredictable.", "p": 47, "quote": "Tramadol is not recommended in these guidelines for use in dentistry"}, {"id": 79, "t": "pain", "q": "Opioids in dentistry should not be used for which pain?", "right": "Chronic, neuropathic or nociplastic pain, or pain in patients younger than 16 years (unless prescribed by a specialist)", "wrong": ["Acute severe postoperative pain in adults", "Severe pain after major trauma", "Acute severe nociceptive dental pain"], "why": "Immediate-release opioid may be used with nonopioid analgesics for acute severe nociceptive pain in adults.", "p": 45, "quote": "opioids should not be used for pain that is chronic, neuropathic or nociplastic, or for pain in patients younger than 16 years"}, {"id": 80, "t": "pain", "q": "What are the dosing rules for opioid prescribing in dentistry?", "right": "Lowest dose of an immediate-release preparation, no more often than every 4 hours, for the shortest time, smallest quantity", "wrong": ["Modified-release preparation twice daily for convenience", "Combine two opioids for better analgesia", "Dose every 2 hours for the first day"], "why": "Combinations of opioids give no additional benefit. Also check real-time prescription monitoring.", "p": 45, "quote": "no more frequently than every 4 hours"}, {"id": 81, "t": "pain", "q": "After how many days of opioid use can neuroadaptation (tolerance, dependence, hyperalgesia) begin?", "right": "As little as 7 to 10 days", "wrong": ["24 hours", "3 days", "3 months"], "why": "Long-term opioid use often begins in the acute pain setting.", "p": 46, "quote": "can occur after as little as 7 to 10 days use"}, {"id": 82, "t": "pain", "q": "A patient develops hives after taking an opioid. What is the most likely explanation, and what does widespread urticaria suggest?", "right": "Pseudoallergy via histamine release; widespread urticaria suggests a true allergic response", "wrong": ["Always true IgE anaphylaxis", "Always an intolerance with no significance", "A drug interaction with paracetamol"], "why": "Pseudoallergy is usually limited to skin, is dose dependent and needs no prior exposure.", "p": 46, "quote": "widespread urticaria ('hives') – suggests an allergic response"}, {"id": 83, "t": "pain", "q": "What should you advise a patient to do about opioid-induced constipation?", "right": "Increase fluid, fibre and exercise; if it develops, promptly start a stimulant laxative (e.g. docusate with senna)", "wrong": ["Stop all fluids", "Take loperamide", "Wait for it to resolve without treatment"], "why": "Also warn about sedation, driving and machinery.", "p": 47, "quote": "the patient should promptly start a stimulant laxative (eg docusate with senna)"}, {"id": 84, "t": "pain", "q": "Which sign is described as a more sensitive indicator of opioid-induced ventilatory impairment than a fall in respiratory rate?", "right": "Sedation", "wrong": ["Miosis", "Nausea", "Itch"], "why": "That's why patients and carers must be taught to recognise excessive sedation.", "p": 46, "quote": "Sedation is a more sensitive indicator of opioid-induced ventilatory impairment than a decrease in respiratory rate"}, {"id": 85, "t": "pain", "q": "Which topical corticosteroids may a general dentist use on oral mucosa without specialist advice?", "right": "Mild or moderate potency: hydrocortisone 0.5–1%, triamcinolone acetonide 0.02–0.1%", "wrong": ["Clobetasol propionate 0.05%", "Betamethasone dipropionate 0.05%", "Any cream, applied sparingly"], "why": "Potent and very potent products need specialist advice. Topical steroids are more potent on oral mucosa than skin.", "p": 51, "quote": "triamcinolone acetonide 0.02%, 0.1%"}, {"id": 86, "t": "pain", "q": "How should a topical corticosteroid cream be applied to the oral mucosa?", "right": "A pea-sized amount smeared thinly, held 1–2 minutes without swallowing, ideally after meals or hygiene", "wrong": ["Rubbed vigorously into dry mucosa then swallowed", "Applied with a cotton bud only at bedtime", "Diluted in water as a mouthwash"], "why": "It is not necessary to dry the mucosa first. Systemic absorption is minimal if used as instructed, despite the 'external use only' label.", "p": 52, "quote": "Hold in the mouth for 1 to 2 minutes without swallowing, and then spit out excess."}, {"id": 87, "t": "pain", "q": "Which is a local adverse effect of topical corticosteroids in the mouth?", "right": "Candidiasis", "wrong": ["Tooth staining", "Enamel hypoplasia", "Gingival hyperplasia"], "why": "Others: mucosal atrophy, capillary fragility, delayed healing, altered pigmentation. Risk is higher with immune compromise, smoking, dentures and hyposalivation.", "p": 50, "quote": "Local adverse effects include candidiasis, mucosal atrophy"}, {"id": 88, "t": "pain", "q": "Who should prescribe systemic corticosteroids for oral or dental conditions?", "right": "A dental specialist only", "wrong": ["Any dentist", "Pharmacist", "The patient's GP only"], "why": "Local applications are usually effective. One intraoperative dose can limit severe postoperative swelling.", "p": 53, "quote": "Systemic corticosteroids should only be prescribed by a dental specialist."}, {"id": 89, "t": "mouth", "q": "What is the concentration range of chlorhexidine mouthwash in TG4?", "right": "0.12% and 0.2%", "wrong": ["0.02% and 0.05%", "1% and 2%", "0.5% only"], "why": "Chlorhexidine is bactericidal and fungicidal; it adsorbs onto oral surfaces so lasts longer.", "p": 55, "quote": "chlorhexidine gluconate in concentrations of 0.12% and 0.2%"}, {"id": 90, "t": "mouth", "q": "For how long is chlorhexidine mouthwash usually limited?", "right": "Short periods, up to 2 weeks", "wrong": ["Up to 6 months", "Indefinitely", "24 hours"], "why": "Adverse effects: burning, altered taste, calculus, brown staining (removable professionally), impaired wound healing.", "p": 55, "quote": "Chlorhexidine use is usually limited to short periods (up to 2 weeks)"}, {"id": 91, "t": "mouth", "q": "Does TG4 recommend subgingival irrigation with chlorhexidine?", "right": "No — not in any patient, because of the risk of allergy", "wrong": ["Yes, in periodontal abscess only", "Yes, at 0.2% only", "Yes, for children only"], "why": "Chlorhexidine allergy has been reported, sometimes life-threatening; avoid via all routes if reported.", "p": 55, "quote": "Subgingival irrigation using chlorhexidine is not recommended in any patient"}, {"id": 92, "t": "mouth", "q": "What does an antiseptic mouthwash do to existing plaque?", "right": "Nothing — it can reduce plaque formation but not existing plaque, which needs mechanical cleaning", "wrong": ["It dissolves it", "It removes supragingival plaque and calculus", "It penetrates periodontal pockets"], "why": "They are also only effective against supragingival plaque, not beyond the gingival crevice.", "p": 55, "quote": "Antiseptic mouthwashes can reduce plaque formation but do not reduce existing plaque"}, {"id": 93, "t": "mouth", "q": "What is a reasonable use of antiseptic mouthwash in periodontal disease?", "right": "Short-term use in gingivitis or necrotising gingivitis when inflammation restricts toothbrushing", "wrong": ["As the sole treatment for chronic periodontitis", "As a routine part of oral hygiene for everyone", "Long-term daily use"], "why": "The principal treatment is professional debridement plus meticulous oral hygiene.", "p": 55, "quote": "for short-term use in patients with gingivitis or necrotising gingivitis when inflammation restricts normal toothbrushing"}, {"id": 94, "t": "mouth", "q": "What hydrogen peroxide concentration is used as a mouthwash, and what risk occurs at high concentrations?", "right": "Around 1.5%; concentrations of 30–35% (bleaching) can cause mucosal burns", "wrong": ["Around 15%; no risk at any concentration", "Around 3% undiluted; burns only above 50%", "Around 30%; safe for daily use"], "why": "Continued use can cause reversible hypertrophy of the tongue papillae.", "p": 55, "quote": "low concentration hydrogen peroxide mouthwash (eg 1.5%)"}, {"id": 95, "t": "mouth", "q": "Povidone-iodine mouthwash should be avoided in which situation?", "right": "Pregnancy and lactation, because of the risk of neonatal hypothyroidism", "wrong": ["Children over 12", "Patients taking chlorhexidine", "Patients with dry mouth"], "why": "It can also irritate skin and mucous membranes.", "p": 56, "quote": "Povidone-iodine should not be used during pregnancy or lactation because it can cause hypothyroidism in the neonate."}, {"id": 96, "t": "mouth", "q": "Which antiseptic does TG4 specifically say is not recommended?", "right": "Triclosan", "wrong": ["Cetylpyridinium chloride", "Povidone-iodine", "Essential-oil mouthwash"], "why": "Concerns: antimicrobial resistance and environmental effects on aquatic organisms.", "p": 56, "quote": "Triclosan is not recommended"}, {"id": 97, "t": "mouth", "q": "What is benzydamine, and what is it used for in the mouth?", "right": "An NSAID with analgesic properties, for temporary relief of painful inflammatory oral mucosal conditions", "wrong": ["An antifungal for candidiasis", "A fluoride mouthwash", "A corticosteroid for lichen planus"], "why": "Formulations: mouthwash, gel, spray at 0.15–1%. Occasional local numbness, burning, erythema and rash.", "p": 56, "quote": "Benzydamine is a nonsteroidal anti-inflammatory drug (NSAID) with analgesic properties"}, {"id": 98, "t": "mouth", "q": "Which patients should avoid CPP-ACP (casein phosphopeptide–amorphous calcium phosphate) products?", "right": "Patients with dairy (milk protein) allergy", "wrong": ["Patients with fluorosis", "Patients on warfarin", "Patients with metal allergy"], "why": "Casein is a milk protein. CPP-ACP is an adjunct to fluoride, not a substitute.", "p": 56, "quote": "Avoid CPP-ACP in patients with allergies to dairy products because the casein component is a milk protein."}, {"id": 99, "t": "mouth", "q": "Why should patients with dry mouth or oral mucosal disease avoid alcohol-containing mouthwashes?", "right": "They cause profound drying of the oral mucosa", "wrong": ["They stain teeth", "They inactivate fluoride", "They raise blood pressure"], "why": "Alcohol-containing mouthwashes may also be associated with increased oral cancer risk.", "p": 54, "quote": "patients with oral mucosal disease and dry mouth should avoid alcohol-containing mouthwashes because they cause profound drying of the oral mucosa"}, {"id": 100, "t": "la", "q": "How long after an inferior alveolar (block) injection does analgesia occur, roughly?", "right": "4 to 5 minutes", "wrong": ["30 seconds", "10–15 minutes", "Immediately"], "why": "Infiltration takes about 2–3 minutes and topical about 3 minutes. Pulpal analgesia takes longer than soft tissue analgesia.", "p": 58, "quote": "analgesia occurs approximately 2 to 3 minutes after an infiltration injection, 4 to 5 minutes after a block injection, and 3 minutes after topical administration"}, {"id": 101, "t": "la", "q": "What is felypressin, and why is it useful?", "right": "An alternative vasoconstrictor to adrenaline with minimal myocardial effects at the dental cartridge concentration; safe in pregnancy", "wrong": ["A local anaesthetic that lasts 18 hours", "A preservative in articaine", "A benzodiazepine antagonist"], "why": "Prilocaine with felypressin is first-line for routine dental procedures when adrenaline is contraindicated.", "p": 59, "quote": "Felypressin is an alternative vasoconstrictor to adrenaline (epinephrine) because it has minimal effects on the myocardium"}, {"id": 102, "t": "la", "q": "Which local anaesthetic preparation is first-line for routine dental procedures when adrenaline is contraindicated?", "right": "Prilocaine with felypressin", "wrong": ["Bupivacaine with adrenaline", "Articaine 4% with adrenaline", "Ropivacaine"], "why": "Adrenaline may be contraindicated in unstable elevated blood pressure or recent myocardial infarction.", "p": 62, "quote": "prilocaine with felypressin intermediate-acting"}, {"id": 103, "t": "la", "q": "A cause of a failed local anaesthetic block is suspected. What does TG4 advise?", "right": "Reassess the anatomy and technique; a repeat injection may be attempted provided the maximum dose is not exceeded", "wrong": ["Repeat the same dose immediately regardless of total", "Switch to a much higher concentration", "Abandon local anaesthetic for the patient"], "why": "Multiple doses within a short time can accumulate and cause toxicity.", "p": 59, "quote": "A repeat injection may be attempted, provided the maximum dose is not exceeded"}, {"id": 104, "t": "la", "q": "How do you reduce the risk of intravascular injection?", "right": "Aspirate to exclude blood, then inject slowly and monitor the patient's response", "wrong": ["Inject rapidly to limit tissue trauma", "Use a higher adrenaline concentration", "Inject only with topical anaesthetic first"], "why": "Intravascular injection, particularly with a vasoconstrictor, can cause profound systemic effects.", "p": 59, "quote": "aspirate to exclude the presence of blood, then inject slowly and monitor the patient's response"}, {"id": 105, "t": "la", "q": "Which are early signs of local anaesthetic systemic toxicity?", "right": "Minor CNS effects: restlessness, anxiety, tinnitus, dizziness, blurred vision, tremors, drowsiness", "wrong": ["Bradycardia and hypotension only", "Rash and wheeze", "Chest pain and sweating only"], "why": "Serious effects are seizures and cardiovascular toxicity. With bupivacaine, cardiovascular effects may come BEFORE CNS effects.", "p": 60, "quote": "Minor central nervous system (CNS) effects (eg restlessness, anxiety, tinnitus, dizziness, blurred vision, tremors, CNS depression, drowsiness) are early indicators of systemic toxicity"}, {"id": 106, "t": "la", "q": "What is the first action if you suspect local anaesthetic systemic toxicity?", "right": "Stop administering the local anaesthetic and provide appropriate management", "wrong": ["Finish the injection quickly", "Give a further dose to check for effect", "Send the patient home to rest"], "why": "Resuscitation drugs and oxygen should be immediately available.", "p": 60, "quote": "If systemic adverse effects of local anaesthetics occur, stop administration of the local anaesthetic and provide appropriate management."}, {"id": 107, "t": "la", "q": "What is the maximum safe single dose of lidocaine 2% with adrenaline in TG4?", "right": "7 mg/kg", "wrong": ["2 mg/kg", "4.5 mg/kg", "10 mg/kg"], "why": "For a 70 kg adult: 490 mg = 24.5 mL = 11 × 2.2 mL cartridges.", "p": 63, "quote": "maximum safe single dose of lidocaine (with adrenaline) is 7 mg/kg"}, {"id": 108, "t": "la", "q": "Using TG4's worked example, how many 2.2 mL cartridges of 2% lidocaine with adrenaline is the maximum for a 70 kg patient?", "right": "11 cartridges (24.5 mL)", "wrong": ["5 cartridges", "20 cartridges", "25 cartridges"], "why": "7 mg/kg × 70 kg = 490 mg; 2% = 20 mg/mL so 24.5 mL; divided by 2.2 mL = 11.", "p": 63, "quote": "the total volume administered must not exceed 24.5 mL or 11 cartridges containing 2.2 mL each"}, {"id": 109, "t": "la", "q": "How do you convert a percentage local anaesthetic concentration to mg/mL?", "right": "Multiply by 10 (e.g. 2% = 20 mg/mL)", "wrong": ["Divide by 10", "Multiply by 100", "Multiply by 1000"], "why": "Then dose (mg) ÷ mg/mL gives volume in mL.", "p": 63, "quote": "To convert a percentage concentration to mg/mL, multiply by 10"}, {"id": 110, "t": "la", "q": "What is the approximate maximum volume of articaine 4% with adrenaline for a 20 kg child (7 mg/kg)?", "right": "About 3.5 mL", "wrong": ["About 7 mL", "About 12 mL", "About 1 mL"], "why": "7 mg/kg × 20 kg = 140 mg; 4% = 40 mg/mL, so 3.5 mL. Articaine is not to be used under 4 years.", "p": 64, "quote": "approximate maximum volume for a 20 kg child [NB4] 3.5 mL"}, {"id": 111, "t": "la", "q": "What is the maximum mg/kg dose for prilocaine 4% (plain)?", "right": "6 mg/kg", "wrong": ["9 mg/kg", "2 mg/kg", "12 mg/kg"], "why": "Prilocaine 3% with felypressin or adrenaline 1:300,000 is 9 mg/kg.", "p": 64, "quote": "prilocaine 4% (40 mg/mL) maximum mg/kg dose of local anaesthetic [NB3] 6 mg/kg"}, {"id": 112, "t": "la", "q": "In which age group should articaine not be used?", "right": "Children younger than 4 years", "wrong": ["Younger than 1 year", "Younger than 12 years", "Younger than 16 years"], "why": "Mepivacaine: not under 3 years. Bupivacaine: not under 12 years.", "p": 61, "quote": "do not use in children younger than 4 years"}, {"id": 113, "t": "la", "q": "Bupivacaine should not be used in children younger than what age?", "right": "12 years", "wrong": ["3 years", "4 years", "6 years"], "why": "It is also more cardiotoxic than ropivacaine, and cardiac toxicity may come before neurological signs.", "p": 62, "quote": "do not use in children younger than 12 years"}, {"id": 114, "t": "la", "q": "Which long-acting local anaesthetic is useful when 12–18 hours of analgesia is required (postoperative pain, refractory acute dental pain)?", "right": "Ropivacaine", "wrong": ["Lidocaine plain", "Prilocaine 4%", "Articaine"], "why": "Concentrations up to 0.5% can be used in children. It is less cardiotoxic than bupivacaine.", "p": 62, "quote": "useful for situations in which prolonged analgesia (eg 12 to 18 hours) is required"}, {"id": 115, "t": "la", "q": "What do vasoconstrictors do when added to local anaesthetic?", "right": "Prolong duration of action and reduce bleeding", "wrong": ["Shorten onset", "Reduce toxicity to zero", "Increase pH"], "why": "Anaesthetics without adrenaline may be needed in allergy to the preservatives or unstable hypertension/recent MI.", "p": 62, "quote": "The addition of vasoconstrictors to local anaesthetics prolongs duration of action and reduces bleeding"}, {"id": 116, "t": "sed", "q": "In dentistry, what level of sedation are dentists restricted to unless endorsed by the Dental Board?", "right": "Minimal sedation (anxiolysis)", "wrong": ["Moderate sedation", "Deep sedation", "General anaesthesia"], "why": "Deep sedation is restricted to appropriately trained medical practitioners and anaesthetists in approved facilities.", "p": 66, "quote": "Dentists are restricted to providing minimal sedation, unless endorsed by the Dental Board to provide moderate sedation."}, {"id": 117, "t": "sed", "q": "What should be tried before drugs to reduce dental anxiety?", "right": "Nonpharmacological strategies (environment, distraction, calm communication)", "wrong": ["A benzodiazepine as routine", "Nitrous oxide as routine", "Referral for GA"], "why": "E.g. soothing music, headphones, virtual reality, 'We'll take this step by step'.", "p": 66, "quote": "Use nonpharmacological strategies before considering drugs to reduce patient anxiety."}, {"id": 118, "t": "sed", "q": "Which sedation drug is preferred in children needing minimal sedation?", "right": "Nitrous oxide", "wrong": ["Diazepam", "Temazepam", "Midazolam orally"], "why": "Benzodiazepine minimal sedation is not recommended under 13 years unless paediatric specialist or Dental Board endorsed.", "p": 73, "quote": "If minimal sedation is required in children, nitrous oxide is the preferred agent."}, {"id": 119, "t": "sed", "q": "What is the typical temazepam regimen for minimal sedation in a patient aged 13 or over?", "right": "10 mg orally, 1 hour before the procedure, given at the practice", "wrong": ["20 mg the night before, taken at home", "5 mg 4 hours before", "10 mg during the procedure"], "why": "Dose may go to 20 mg at later visits if not at increased risk. Lorazepam 1 mg alternatively. Never repeat doses.", "p": 73, "quote": "temazepam 10 mg orally, 1 hour before the procedure, administered at the dental practice"}, {"id": 120, "t": "sed", "q": "What is TG4's diazepam dose for minimal sedation when a longer duration of anxiolysis is needed?", "right": "2 to 5 mg orally, 1 hour before the procedure (lower end in older/frail)", "wrong": ["10 mg orally the night before", "5–10 mg twice daily for a week", "1 mg IV"], "why": "Diazepam lasts over 24 hours. Do not give repeat doses of any benzodiazepine even if anxiolysis seems inadequate.", "p": 73, "quote": "diazepam 2 to 5 mg orally, 1 hour before the procedure"}, {"id": 121, "t": "sed", "q": "A patient who took extra sedatives (or alcohol) presents for minimal sedation. Which agent is preferred?", "right": "Nitrous oxide", "wrong": ["Temazepam", "Lorazepam", "Diazepam"], "why": "Oral benzodiazepines in patients using sedatives can cause oversedation or inadequate sedation.", "p": 70, "quote": "nitrous oxide is preferred"}, {"id": 122, "t": "sed", "q": "Which is a contraindication to nitrous oxide?", "right": "Air trapped in a body cavity (e.g. pneumothorax, bowel obstruction, recent middle-ear or eye surgery) or current bleomycin therapy", "wrong": ["Mild anxiety", "Age over 60", "Previous use of local anaesthetic"], "why": "Also inability to breathe through the nose. Bleomycin + N2O raises pulmonary toxicity (lung fibrosis) risk.", "p": 69, "quote": "current bleomycin therapy"}, {"id": 123, "t": "sed", "q": "What concentration of nitrous oxide usually produces clinical effect?", "right": "35 to 45%, with a minimum 30% oxygen delivered by the equipment", "wrong": ["5 to 10%", "60 to 70%", "100%"], "why": "Peak effect is 3–5 minutes. After 10 minutes or more of N2O, give supplemental oxygen for 3–5 minutes.", "p": 74, "quote": "clinical effect, which is usually achieved at concentrations of 35 to 45%"}, {"id": 124, "t": "sed", "q": "After nitrous oxide sedation for 10 minutes or longer, what is common practice?", "right": "Give supplemental oxygen for 3 to 5 minutes", "wrong": ["Discharge immediately", "Give naloxone", "Give flumazenil"], "why": "This prevents an abrupt fall in arterial oxygen saturation and helps scavenge exhaled gas.", "p": 74, "quote": "administer supplemental oxygen for 3 to 5 minutes after stopping nitrous oxide"}, {"id": 125, "t": "sed", "q": "After minimal sedation with an oral benzodiazepine, how should the patient be discharged?", "right": "To a responsible adult and supervised until fully recovered; no driving until the following day", "wrong": ["Alone, provided they appear alert", "With a taxi and no supervision", "Only after 24 hours in the practice"], "why": "All patients with minimal sedation (including N2O) are advised not to drive until the following day.", "p": 71, "quote": "Advise all patients who have had minimal sedation (oral benzodiazepines, nitrous oxide or methylflurane) not to drive until the following day."}, {"id": 126, "t": "sed", "q": "Which airway protection measure does TG4 recommend during sedation if possible?", "right": "Use a rubber dam, with good suction and appropriate instrumentation", "wrong": ["Lay the patient fully flat", "Use cotton rolls only", "Avoid suction to keep the mouth dry"], "why": "Pulse oximetry is strongly recommended and protection of the airway is paramount.", "p": 71, "quote": "Use a rubber dam if possible, to protect the airway."}, {"id": 127, "t": "sed", "q": "What fasting advice is given for minimal sedation?", "right": "A light meal is fine, but nothing to eat or drink within 2 hours of the appointment", "wrong": ["Fast for 12 hours", "Eat a large meal beforehand", "No fasting needed at all, including for alcohol"], "why": "No alcohol, illicit drugs or extra sedatives on the day.", "p": 71, "quote": "do not have anything to eat or drink within 2 hours of your appointment"}, {"id": 128, "t": "sed", "q": "Which benzodiazepine is often used for dental minimal sedation because of its relatively fast onset and shorter duration?", "right": "Temazepam", "wrong": ["Diazepam", "Midazolam injection given orally", "Clonazepam"], "why": "Do NOT give injectable midazolam orally — poorly documented and risk of oversedation.", "p": 72, "quote": "Temazepam is often used because it has a relatively fast onset"}, {"id": 129, "t": "sed", "q": "Methoxyflurane in dentistry is best suited to what?", "right": "Shorter procedures with severe pain (e.g. treating dry socket); nitrous oxide is preferred for longer ones", "wrong": ["Long procedures under sedation", "Children under 5", "Routine restorations"], "why": "It is absorbed into fatty tissue, which prolongs recovery compared to N2O.", "p": 74, "quote": "It can be considered for shorter procedures, particularly those associated with severe pain (eg treatment of dry socket)"}, {"id": 130, "t": "proph", "q":
