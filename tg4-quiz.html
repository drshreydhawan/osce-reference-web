 "Does TG4 recommend surgical antibiotic prophylaxis for third molar (wisdom tooth) surgery?", "right": "No — third molar surgery, extractions, implants, periodontal and periapical surgery do not require it", "wrong": ["Yes — a single dose of amoxicillin 1 hour before", "Yes — but only for mandibular third molars", "Yes — 5 days post-operatively"], "why": "Prophylaxis is reserved for some oral and maxillofacial surgical procedures.", "p": 77, "quote": "third molar (wisdom tooth) surgery tooth extractions insertion or removal of dental implants"}, {"id": 131, "t": "proph", "q": "Which procedure DOES require surgical antibiotic prophylaxis?", "right": "Open reduction and internal fixation of a mandibular fracture", "wrong": ["Simple tooth extraction", "Alveoloplasty", "Periapical surgery"], "why": "Others: insertion of prosthetic material (except implants), intraoral bone grafts, orthognathic surgery, cleft lip and palate repair.", "p": 77, "quote": "open reduction and internal fixation of mandibular fractures or midfacial"}, {"id": 132, "t": "proph", "q": "Is antibiotic prophylaxis routinely indicated for dental implant insertion?", "right": "No — it does not reduce the risk of postoperative infection (only a marginal 1–2% increase in implant retention)", "wrong": ["Yes — amoxicillin 2 g 1 hour before", "Yes — but only in the maxilla", "Yes — 5 days after placement"], "why": "Consider it a separate issue from endocarditis prophylaxis in a high-risk cardiac patient.", "p": 77, "quote": "is not routinely indicated for implant insertion because it does not reduce the risk of postoperative infection"}, {"id": 133, "t": "proph", "q": "If surgical antibiotic prophylaxis is given, when must it be administered?", "right": "Before the surgical incision or the start of the procedure", "wrong": ["Immediately after the procedure", "The next morning", "Only once bleeding has stopped"], "why": "Prophylaxis should not continue beyond 24 hours.", "p": 78, "quote": "it must be administered before either the surgical incision or the start of the procedure"}, {"id": 134, "t": "proph", "q": "A patient has a hip replacement. Do they need antibiotic prophylaxis for a tooth extraction?", "right": "No — the presence of a joint prosthesis does not alter the indication for prophylaxis", "wrong": ["Yes — amoxicillin 2 g", "Yes — for 2 years after joint surgery", "Yes — clindamycin 600 mg"], "why": "Risk of seeding a joint prosthesis is low and adverse effects outweigh benefits, even for extractions.", "p": 79, "quote": "neither the indication for prophylaxis nor the choice of antibiotic regimen is altered by the presence of a joint prosthesis"}, {"id": 135, "t": "proph", "q": "Which cardiac condition IS an indication for infective endocarditis prophylaxis before certain dental procedures?", "right": "A prosthetic cardiac valve", "wrong": ["Mitral valve prolapse", "A cardiac pacemaker", "Previous coronary artery stenting"], "why": "Also: previous IE, prosthetic material in valve repair, VADs, unrepaired cyanotic CHD or repaired defects with residual defects at a prosthetic patch, and rheumatic heart disease.", "p": 83, "quote": "prosthetic cardiac valve, including transcatheter-implanted prosthesis or homograft"}, {"id": 136, "t": "proph", "q": "Is rheumatic heart disease an indication for endocarditis prophylaxis under TG4?", "right": "Yes — it is listed among the cardiac conditions", "wrong": ["No — only prosthetic valves count", "No — only in children", "Only if a murmur is present"], "why": "This differs from some older guidance, so check the current table.", "p": 83, "quote": "rheumatic heart disease"}, {"id": 137, "t": "proph", "q": "For endocarditis prophylaxis, which dental procedures qualify?", "right": "Those involving manipulation of gingival or periapical tissue or perforation of the oral mucosa", "wrong": ["Only extractions", "Any dental appointment", "Only procedures with significant bleeding"], "why": "E.g. extractions, implants, biopsy, scaling (supra- and subgingival), replanting avulsed teeth. 'Significant bleeding' does not predict bacteraemia.", "p": 83, "quote": "only those involving manipulation of the gingival or periapical tissue or perforation of the oral mucosa"}, {"id": 138, "t": "proph", "q": "What is the first-line oral endocarditis prophylaxis regimen for a high-risk patient with no allergy?", "right": "Amoxicillin 2 g orally, 60 minutes before the procedure", "wrong": ["Amoxicillin 500 mg orally, 30 minutes before", "Clindamycin 600 mg orally, 1 hour before", "Amoxicillin 3 g, 2 hours before"], "why": "Child: 50 mg/kg up to 2 g.", "p": 85, "quote": "amoxicillin 2 g (child: 50 mg/kg up to 2 g) orally, 60 minutes before the procedure"}, {"id": 139, "t": "proph", "q": "Which antibiotic is no longer recommended for endocarditis prophylaxis in dental procedures?", "right": "Clindamycin", "wrong": ["Amoxicillin", "Cephalexin", "Doxycycline"], "why": "It is associated with a higher frequency of severe adverse reactions, mostly C. difficile infection.", "p": 85, "quote": "Clindamycin is no longer recommended for endocarditis prophylaxis for dental procedures"}, {"id": 140, "t": "proph", "q": "Endocarditis prophylaxis in a patient with a nonsevere penicillin reaction: which oral option does TG4 give?", "right": "Cephalexin 2 g orally, 60 minutes before the procedure", "wrong": ["Clindamycin 600 mg", "Metronidazole 400 mg", "No prophylaxis is possible"], "why": "Consider the extent of the reaction and patient acceptability.", "p": 85, "quote": "cephalexin 2 g (child: 50 mg/kg up to 2 g) orally, 60 minutes before the procedure"}, {"id": 141, "t": "proph", "q": "Endocarditis prophylaxis in a patient with a SEVERE penicillin reaction: which oral options does TG4 give?", "right": "Doxycycline or azithromycin, 60 minutes before the procedure", "wrong": ["Cephalexin 2 g", "Clindamycin 600 mg", "Amoxicillin under observation"], "why": "Azithromycin can prolong the QT interval — consult the medical practitioner first. Doxycycline: take with a large glass of water and stay upright 30 minutes.", "p": 85, "quote": "doxycycline or azithromycin can be used"}, {"id": 142, "t": "proph", "q": "What is the adult oral dose of doxycycline for endocarditis prophylaxis (severe penicillin allergy)?", "right": "100 mg, 60 minutes before the procedure", "wrong": ["200 mg", "50 mg", "500 mg"], "why": "Short-term doxycycline is not associated with tooth discolouration, so it can be used in children of all ages.", "p": 85, "quote": "adult: 100 mg"}, {"id": 143, "t": "proph", "q": "What is more likely to cause endocarditis-related bacteraemia over a year: dental procedures or daily oral hygiene?", "right": "Daily oral hygiene, because it is done far more often", "wrong": ["Dental procedures, by a wide margin", "They are identical", "Neither causes bacteraemia"], "why": "That is why good oral health matters more than antibiotic prophylaxis.", "p": 82, "quote": "endocarditis-related bacteraemia may be more likely to result from daily oral hygiene activities than from specific procedures"}, {"id": 144, "t": "proph", "q": "Which organisms typically cause bacteraemia and endocarditis after dental procedures?", "right": "Viridans group streptococci", "wrong": ["Staphylococcus aureus", "Pseudomonas aeruginosa", "Enterococcus faecalis"], "why": "Hence amoxicillin is the drug of choice.", "p": 84, "quote": "Bacteraemia associated with dental procedures usually involves viridans group streptococci"}, {"id": 145, "t": "surg", "q": "What usually causes pain and swelling after oral surgery?", "right": "Inflammation from trauma rather than infection", "wrong": ["Infection", "Allergy to local anaesthetic", "Dry socket"], "why": "The incidence of infection even after difficult third molar extraction is only 2–5%.", "p": 88, "quote": "Pain and swelling follow most oral surgical procedures, usually caused by inflammation from trauma, rather than infection."}, {"id": 146, "t": "surg", "q": "Normal post-extraction swelling peaks at about what time?", "right": "Increases over the first 48 hours; may take up to 3 days to reach maximum", "wrong": ["Peaks at 2 hours", "Peaks at 7 days", "Should never increase after the first day"], "why": "Worsening pain and swelling after day 4 raises concern for infection.", "p": 88, "quote": "Swelling normally increases in the first 48 hours after oral surgery and may take up to 3 days to reach its maximum."}, {"id": 147, "t": "surg", "q": "Which is a risk factor for greater swelling after third molar removal?", "right": "Female gender, smoking, age over 25, mandibular third molar, deeper impaction", "wrong": ["Male gender, non-smoker, age 18", "Maxillary third molar with erupted crown", "Use of pre-operative antibiotics"], "why": "Vaping is likely similar to smoking, but evidence is lacking.", "p": 88, "quote": "female gender, smoking [Note 1], age over 25 years at time of surgery"}, {"id": 148, "t": "surg", "q": "How should cold compresses be used after oral surgery?", "right": "Intermittently for up to 20 minutes at a time in the first 24 hours, then warm saline rinses", "wrong": ["Continuously for 3 days", "Heat packs in the first 24 hours", "Not at all"], "why": "Also reassurance, NSAIDs and other analgesics, and monitoring.", "p": 89, "quote": "external application of a cold compress intermittently for up to 20 minutes at a time during the first 24 hours"}, {"id": 149, "t": "surg", "q": "Does TG4 recommend routine postoperative corticosteroids after dentoalveolar surgery?", "right": "No — evidence of benefit is insufficient (intraoperative dexamethasone can reduce swelling/trismus, by experienced clinicians)", "wrong": ["Yes — prednisolone 25 mg for 5 days", "Yes — dexamethasone 4 mg for 3 days", "Yes — but only for maxillary surgery"], "why": "Intraoperative steroids have negligible effect on pain.", "p": 89, "quote": "Routine postoperative corticosteroids are not recommended because evidence of benefit is insufficient."}, {"id": 150, "t": "surg", "q": "Which feature suggests infection rather than normal postoperative swelling?", "right": "Worsening pain and increasing swelling after day 4, purulent discharge, foul taste, progressive trismus, fluctuant swelling, or fever", "wrong": ["Swelling that is worst on day 2", "Mild bruising", "Slight ooze in the first hours"], "why": "Urgent hospital transfer if severe local or systemic signs.", "p": 89, "quote": "worsening pain and increasing swelling (both occurring after day 4 postoperatively)"}, {"id": 151, "t": "surg", "q": "Approximately how common is alveolar osteitis (dry socket) after extraction?", "right": "About 5% of extractions", "wrong": ["About 0.5%", "About 25%", "About 50%"], "why": "It is a localised painful osteitis following premature lysis of the blood clot.", "p": 90, "quote": "It complicates approximately 5% of tooth extractions."}, {"id": 152, "t": "surg", "q": "Dry socket pain typically starts when?", "right": "Increasing in severity between 1 and 4 days after the extraction", "wrong": ["Immediately after the anaesthetic wears off, then settling", "At 3 weeks", "Only after the sutures are removed"], "why": "A disintegrated clot in the socket, with or without halitosis, is diagnostic.", "p": 90, "quote": "increases in severity between 1 and 4 days after the extraction"}, {"id": 153, "t": "surg", "q": "Do antibiotics have a role in managing dry socket?", "right": "No — antibiotic therapy has no place in managing alveolar osteitis", "wrong": ["Yes — amoxicillin for 5 days", "Yes — metronidazole for 3 days", "Yes — if the patient smokes"], "why": "It is a healing failure but is commonly misdiagnosed as infection.", "p": 90, "quote": "Antibiotic therapy has no place in the management of alveolar osteitis."}, {"id": 154, "t": "surg", "q": "Which is a reported risk factor for dry socket?", "right": "Use of combined oral contraception (also smoking, female gender, poor hygiene, mandibular removal, surgical trauma)", "wrong": ["Male gender", "Maxillary tooth removal", "Younger age under 10"], "why": "History of a previous dry socket is also a risk factor.", "p": 90, "quote": "use of combined oral contraception"}, {"id": 155, "t": "surg", "q": "What are the initial management steps for dry socket?", "right": "Irrigate with warm sterile saline, give analgesia, and place an obtundent dressing (e.g. dry socket paste)", "wrong": ["Prescribe antibiotics and review at 5 days", "Curette the socket to induce bleeding, no analgesia", "Leave alone with reassurance only"], "why": "It usually resolves over 2–3 weeks. Any dressing residue at review must be removed. Consider a long-acting local anaesthetic with adrenaline.", "p": 90, "quote": "socket irrigation with warm sterile saline until there is no more debris present"}, {"id": 156, "t": "surg", "q": "Dry-socket pain persists beyond 3 weeks or signs appear outside the socket. What should you do?", "right": "Review the diagnosis (e.g. osteomyelitis, MRONJ, squamous cell carcinoma)", "wrong": ["Repeat the dressing", "Start antibiotics", "Increase the analgesic"], "why": "Differentials include mandibular osteomyelitis, medication-related osteonecrosis of the jaws and alveolar SCC.", "p": 90, "quote": "If pain persists for more than 3 weeks or there are signs outside the tooth socket"}, {"id": 157, "t": "surg", "q": "What is the most important factor in achieving haemostasis?", "right": "Pressure applied at the wound", "wrong": ["Tranexamic acid", "Adrenaline", "Warm saline"], "why": "Common mistakes: placing gauze over adjacent teeth instead of the bleeding site, or using excessive gauze.", "p": 93, "quote": "pressure is the most important factor in achieving haemostasis"}, {"id": 158, "t": "surg", "q": "How does TG4 prepare a 5% tranexamic acid rinse?", "right": "Dilute a 500 mg tablet in 10 mL of water", "wrong": ["Dilute a 500 mg tablet in 100 mL of water", "Dissolve 5 g in 10 mL", "Dilute a 1 g tablet in 5 mL"], "why": "Use to rinse the site or soak gauze. The patient may use it 6-hourly for up to 48 hours, not swallowed.", "p": 93, "quote": "A 5% tranexamic rinse is prepared by diluting a 500 mg tablet of tranexamic acid in 10 mL of water."}, {"id": 159, "t": "surg", "q": "May a dentist compound tranexamic acid mouthwash for a patient to use at home?", "right": "No — it is not within a dentist's scope to compound it; supply of tablets must meet supply and packaging requirements", "wrong": ["Yes, freely", "Yes, but only 1%", "Yes, but only for warfarin patients"], "why": "The mouthwash is not commercially available; a compounding pharmacy can make it.", "p": 94, "quote": "It is not within a dentist's scope of practice to compound tranexamic acid mouthwash for a patient to use at home"}, {"id": 160, "t": "surg", "q": "A patient rings you with post-extraction bleeding. What is the first advice?", "right": "Sit upright, place gauze directly and firmly over the wound, and bite hard or press for 15 minutes", "wrong": ["Lie flat and rinse vigorously", "Rinse with warm salt water repeatedly", "Come in immediately and do nothing at home"], "why": "In most cases this stops the bleeding. Brisk bleeding is usually from torn soft tissue rather than the socket.", "p": 94, "quote": "bite hard or press a finger firmly over the wound for 15 minutes"}, {"id": 161, "t": "surg", "q": "Bleeding from multiple extraction sites suggests what?", "right": "A systemic cause (e.g. anticoagulant, platelet disorder, von Willebrand disease)", "wrong": ["A local cause only", "Dry socket", "Infection"], "why": "Bleeding from one site of several is likely local.", "p": 91, "quote": "if the bleeding occurs from multiple extraction sites, consider systemic causes"}, {"id": 162, "t": "surg", "q": "Bleeding that initially stops and restarts several days after oral surgery is most commonly caused by what?", "right": "Localised infection", "wrong": ["Anticoagulants", "Dry socket", "Vasoconstrictor rebound"], "why": "Manage it as an odontogenic infection after dentoalveolar surgery.", "p": 95, "quote": "is most commonly caused by a localised infection"}, {"id": 163, "t": "surg", "q": "Severe post-implant sublingual bleeding in an edentulous anterior mandible is usually from what?", "right": "Nutrient vessels from the floor of mouth marked by a small lingual foramen", "wrong": ["The inferior alveolar nerve", "The mental foramen", "The maxillary sinus"], "why": "Often noticed late and can be life threatening.", "p": 92, "quote": "often marked by a small lingual foramen"}, {"id": 164, "t": "surg", "q": "What is the incidence of oroantral communication after maxillary third molar extraction?", "right": "3 to 13%", "wrong": ["0.1%", "30%", "50%"], "why": "Examine with a mirror after extraction of any maxillary tooth; avoid a Valsalva manoeuvre.", "p": 96, "quote": "The incidence after maxillary third molar extractions is reported to be 3 to 13%."}, {"id": 165, "t": "surg", "q": "Why should you avoid the Valsalva manoeuvre to test for an oroantral communication?", "right": "It can cause or worsen the communication if the sinus lining is still intact", "wrong": ["It is painful", "It causes epistaxis", "It is inaccurate but harmless"], "why": "Instead examine carefully using a mirror.", "p": 96, "quote": "this can cause or worsen an oroantral communication when the sinus lining is still intact"}, {"id": 166, "t": "surg", "q": "Management of an oroantral communication smaller than 2 mm?", "right": "Sutures across the socket to support the clot, and sinus precautions for 2 weeks", "wrong": ["Immediate buccal advancement flap", "Pack the sinus with gauze", "No management needed"], "why": "Precautions: no nose-blowing, no drinking through a straw, no open-mouth sneezing. Nasal decongestant is recommended regardless of size.", "p": 96, "quote": "place sutures across the socket to support the blood clot, and recommend sinus precautions for 2 weeks"}, {"id": 167, "t": "surg", "q": "A communication larger than 3 mm needs what?", "right": "Primary repair, usually a buccal advancement flap, by an experienced surgeon (e.g. oral and maxillofacial surgeon)", "wrong": ["Sutures across the socket only", "Observation for 2 weeks", "A collagen plug only"], "why": "Multiple failed repairs make future repair harder.", "p": 96, "quote": "For communications larger than 3 mm, primary repair is required"}, {"id": 168, "t": "surg", "q": "An unrecognised oroantral communication develops an epithelial lining. What is this called, and what are the symptoms?", "right": "Oroantral fistula: nasal regurgitation, air escape, foul taste, recurrent sinusitis", "wrong": ["Mucocele: painless swelling", "Alveolar osteitis: severe pain", "Ranula: floor of mouth swelling"], "why": "Confirm with CBCT; repair needs an oral and maxillofacial surgeon.", "p": 97, "quote": "it will develop an epithelial lining (form an oroantral fistula)"}, {"id": 169, "t": "surg", "q": "Which nerve injury causes lip and chin paraesthesia after third molar removal?", "right": "The inferior alveolar nerve", "wrong": ["The lingual nerve", "The buccal nerve", "The mylohyoid nerve"], "why": "Lingual nerve injury causes tongue paraesthesia and loss of taste.", "p": 98, "quote": "inferior alveolar nerve (causing paraesthesia to the lip and chin)"}, {"id": 170, "t": "surg", "q": "How much of a buffer should be kept between an implant and the inferior alveolar nerve?", "right": "At least 2 mm", "wrong": ["0.5 mm", "5 mm", "10 mm"], "why": "Careful planning and measurement is crucial.", "p": 98, "quote": "ensure a 2 mm minimum buffer from the implant to the nerve"}, {"id": 171, "t": "surg", "q": "When should a patient with persisting altered sensation after a dentoalveolar procedure be referred?", "right": "To an oral and maxillofacial surgeon within 3 months if little or no improvement (earlier discussion is encouraged)", "wrong": ["After 12 months", "Never — wait for recovery", "After 3 weeks only if painful"], "why": "Neurosensory testing should track change over time.", "p": 99, "quote": "referral to an oral and maxillofacial surgeon should be made within 3 months"}, {"id": 172, "t": "surg", "q": "What is the immediate management of a sodium hypochlorite extrusion injury?", "right": "Debridement and thorough irrigation", "wrong": ["Warm compress and antibiotics", "Immediate extraction", "No treatment"], "why": "Extrusion causes ulceration, swelling, erythema, necrosis and possibly permanent paraesthesia.", "p": 99, "quote": "Immediate management of a hypochlorite extrusion injury is debridement and thorough irrigation"}, {"id": 173, "t": "surg", "q": "You feel a tooth root displacing during extraction. What is the first step?", "right": "Stop applying elevation to the displacing tooth or root", "wrong": ["Push harder to complete removal", "Take an OPG before touching it", "Leave the patient and book review"], "why": "Then improve visibility, retrieve if visible; if it continues to displace or is not visible, refer urgently to an oral and maxillofacial surgeon.", "p": 100, "quote": "Stop applying any further elevation on the displacing tooth or root."}, {"id": 174, "t": "surg", "q": "A stable lingual plate fracture attached to periosteum after extraction is best managed how?", "right": "Analgesia and reassurance; fragment removal is not required", "wrong": ["Immediate removal", "Antibiotics and OPG", "Referral for ORIF"], "why": "A mobile or detached fragment should be carefully removed, dissecting soft tissue off subperiosteally to protect the lingual nerve.", "p": 101, "quote": "If the fractured plate is stable and attached to periosteum, fragment removal is not required"}, {"id": 175, "t": "surg", "q": "When can a mandibular fracture after third molar extraction present?", "right": "At extraction, or 10–14 days later at the peak of bony osteolysis", "wrong": ["Only at extraction", "After 3 months", "Only if a dry socket occurs"], "why": "Risk: age over 40, atrophic mandible, male, third molar pathology, osteoporosis.", "p": 101, "quote": "Fracture can occur at the time of extraction or 10 to 14 days after surgery"}];
var TOPICS = {
  all:'All topics', abx:'Antibiotics & stewardship', allergy:'Penicillin allergy', pain:'Analgesia & steroids',
  mouth:'Mouthwashes & topicals', la:'Local anaesthetics', sed:'Sedation', proph:'Prophylaxis', surg:'Oral surgery & bleeding'
};
var QUIZ_LEN = 10, KEY = 'tg4quiz.missed.v1';
var app = document.getElementById('app');
var quiz, idx, score, log, deck = 'all';

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(p){return String(p).padStart(3,'0');}
function loadMissed(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
function saveMissed(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
function recordResult(id,right){
  var m=loadMissed(), i=m.indexOf(id);
  if(right && i>-1) m.splice(i,1);
  if(!right && i===-1) m.push(id);
  saveMissed(m);
}
function pickPool(mode){
  var p = POOL;
  if(mode==='missed'){var m=loadMissed(); p=POOL.filter(function(q){return m.indexOf(q.id)>-1;});}
  else if(deck!=='all') p=POOL.filter(function(q){return q.t===deck;});
  return p;
}
function start(mode){
  var p = pickPool(mode);
  if(!p.length) return;
  quiz = shuffle(p.slice()).slice(0,QUIZ_LEN).map(function(q){
    var opts = shuffle([{t:q.right,ok:true}].concat(q.wrong.map(function(w){return {t:w,ok:false};})));
    return {q:q, opts:opts};
  });
  idx=0; score=0; log=[];
  renderQuestion();
}
function counts(){var c={all:POOL.length};POOL.forEach(function(q){c[q.t]=(c[q.t]||0)+1;});return c;}

function renderIntro(){
  var c=counts(), missed=loadMissed().length;
  app.innerHTML =
    '<div class="q-intro">' +
      '<h1>TG4 Quiz</h1>' +
      '<p>Rounds of ten multiple-choice questions on <em>Therapeutic Guidelines: Oral and Dental, v4 (2025)</em>.</p>' +
      '<p style="font-size:13px;color:var(--muted)">Every answer cites the TG4 page it came from, with the source wording and a tap to open the page itself.</p>' +
      '<div class="decks" role="group" aria-label="Choose a topic">' +
        Object.keys(TOPICS).map(function(k){
          return '<button class="deck" data-k="'+k+'" aria-pressed="'+(k===deck)+'">'+TOPICS[k]+'<small>'+(c[k]||0)+'</small></button>';
        }).join('') +
      '</div>' +
      '<button class="btn" id="go">Start a round &rarr;</button>' +
      (missed ? '<div><button class="btn ghost" id="miss" style="margin-top:10px">Practise my '+missed+' missed question'+(missed>1?'s':'')+'</button></div>' : '') +
      '<div class="q-note">Questions and answer order are shuffled each round. Missed questions are remembered on this device only.</div>' +
    '</div>' +
    '<p class="q-disc"><strong>Disclaimer.</strong> Questions are written from TG4 v4 (2025) for ADC OSCE preparation. Always check the current guideline before prescribing. Not clinical advice.</p>';
  app.querySelectorAll('.deck').forEach(function(b){
    b.addEventListener('click',function(){deck=b.dataset.k;renderIntro();});
  });
  document.getElementById('go').addEventListener('click',function(){start('deck');});
  var mb=document.getElementById('miss'); if(mb) mb.addEventListener('click',function(){start('missed');});
}

function renderQuestion(){
  var cur=quiz[idx], n=quiz.length, keys=['A','B','C','D'];
  app.innerHTML =
    '<div class="q-bar-wrap">' +
      '<span class="q-count">Q'+(idx+1)+' / '+n+'</span>' +
      '<div class="q-bar"><div class="q-bar-fill" style="width:'+(idx/n*100)+'%"></div></div>' +
      '<span class="q-score">'+score+' correct</span>' +
    '</div>' +
    '<div class="q-card">' +
      '<span class="q-cat">'+esc(TOPICS[cur.q.t])+'</span>' +
      '<div class="q-text">'+esc(cur.q.q)+'</div>' +
      '<div class="q-lead">Choose one answer.</div>' +
      '<div class="opts">' +
        cur.opts.map(function(o,i){
          return '<button class="opt" data-i="'+i+'"><span class="opt-key">'+keys[i]+'</span><span>'+esc(o.t)+'</span></button>';
        }).join('') +
      '</div><div id="fb"></div>' +
    '</div>';
  app.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){answer(+b.dataset.i);});
  });
  window.scrollTo(0,0);
}

function answer(i){
  var cur=quiz[idx], right=cur.opts[i].ok, n=quiz.length;
  if(right) score++;
  recordResult(cur.q.id,right);
  var rightOpt=cur.opts.filter(function(o){return o.ok;})[0].t;
  log.push({q:cur.q, chosen:cur.opts[i].t, right:right});
  app.querySelectorAll('.opt').forEach(function(b,k){
    b.disabled=true;
    if(cur.opts[k].ok) b.classList.add('correct');
    else if(k===i) b.classList.add('wrong');
    else b.classList.add('faded');
  });
  document.querySelector('.q-score').textContent=score+' correct';
  var last=idx===n-1;
  document.getElementById('fb').innerHTML =
    '<div class="fb '+(right?'ok':'no')+'">' +
      '<div class="fb-verdict">'+(right?'✓ Correct':'✗ Not quite')+'</div>' +
      '<div><span class="fb-answer">'+esc(rightOpt)+'</span></div>' +
      '<div class="fb-tip">'+esc(cur.q.why)+'</div>' +
      '<div class="fb-src">“'+esc(cur.q.quote)+'” — TG4 p.'+cur.q.p+'</div>' +
      '<button class="src-link" data-p="'+cur.q.p+'">View TG4 page '+cur.q.p+' ↗</button>' +
    '</div>' +
    '<div class="res-actions" style="justify-content:flex-start;margin-top:16px">' +
      '<button class="btn" id="next" style="margin-top:0">'+(last?'See my score →':'Next question →')+'</button>' +
    '</div>';
  document.querySelector('.src-link').addEventListener('click',function(){openPage(cur.q.p);});
  document.getElementById('next').addEventListener('click',function(){
    if(last) renderResults(); else {idx++;renderQuestion();}
  });
}

function band(s,n){
  var f=s/n;
  if(f===1) return {t:'Flawless.',m:'That is TG4 in your head, not just on the page.'};
  if(f>=.8) return {t:'Exam-ready.',m:'Tighten the ones you missed and you are safe.'};
  if(f>=.6) return {t:'Getting there.',m:'Read the source page for each miss below — the wording is what examiners mark against.'};
  if(f>=.4) return {t:'Shaky.',m:'Work through the misses, then run another round on the same topic.'};
  return {t:'Back to the page.',m:'Open the TG4 pages linked below, then come straight back for another round.'};
}

function renderResults(){
  var n=quiz.length, b=band(score,n), missed=loadMissed().length;
  app.innerHTML =
    '<div class="res-card">' +
      '<div class="res-score">'+score+'<span>/'+n+'</span></div>' +
      '<div class="res-band">'+b.t+'</div>' +
      '<div class="res-msg">'+b.m+'</div>' +
      '<div class="res-actions">' +
        '<button class="btn" id="again">Another round →</button>' +
        '<button class="btn ghost" id="menu">Change topic</button>' +
      '</div>' +
    '</div>' +
    '<div class="review"><h2>Your round</h2>' +
      log.map(function(r){
        return '<div class="rv"><span class="rv-mark">'+(r.right?'✅':'❌')+'</span><div>' +
          '<div class="rv-name">'+esc(r.q.q)+'</div>' +
          '<div class="rv-detail">TG4 answer: <b>'+esc(r.q.right)+'</b>'+(r.right?'':' · you said '+esc(r.chosen))+'</div>' +
          '<div class="rv-detail" style="margin-top:5px">'+esc(r.q.why)+'</div>' +
          '<button class="src-link" data-p="'+r.q.p+'">TG4 page '+r.q.p+' ↗</button>' +
        '</div></div>';
      }).join('') +
    '</div>' +
    '<p class="q-disc"><strong>Disclaimer.</strong> Questions are written from TG4 v4 (2025) for ADC OSCE preparation. Always check the current guideline before prescribing. Not clinical advice.</p>';
  document.getElementById('again').addEventListener('click',function(){start('deck');});
  document.getElementById('menu').addEventListener('click',renderIntro);
  app.querySelectorAll('.src-link').forEach(function(b){b.addEventListener('click',function(){openPage(b.dataset.p);});});
  window.scrollTo(0,0);
}

function openPage(p){
  var lb=document.createElement('div'); lb.className='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label','TG4 page '+p);
  lb.innerHTML='<div class="lb-top"><span>TG4 page '+p+'</span><button type="button">Close ✕</button></div>' +
    '<img alt="TG4 page '+p+'" src="/data/tg4-pages/'+pad(p)+'.jpg">';
  function close(){document.body.removeChild(lb);document.removeEventListener('keydown',onKey);}
  function onKey(e){if(e.key==='Escape')close();}
  lb.addEventListener('click',function(e){if(e.target===lb||e.target.tagName==='BUTTON')close();});
  document.addEventListener('keydown',onKey);
  document.body.appendChild(lb);
}

renderIntro();
</script>
<script defer src="/feedback-banner.js"></script>
<script defer src="/support-bot.js"></script>
</body>
</html>
